name: Sessions password backup

# The BACKUP for a stored cookie session (never the default, never scheduled). The cookie session is always first. This run logs in ONCE with the saved username and password, and only when the cookie session
# cannot be proved: three checks in a row with no sign either way (or none possible), or REJECTED or EXPIRED, with no acceptance since. At most one attempt a week per platform, two a month; a security check or a code
# rests it for 2 days, an account warning for 30. The fresh cookies live only in this run: export fresh cookies into the platform's secret afterwards to keep the cookie session alive. This is the one narrow
# exception to the stealth layer's cookie-only rule, for the sessions-PROOF path only; Collect and the identities keep `password_fallback: never` (see contentintel/session_password.py).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "which platform's session to back up"
        required: true
        type: choice
        options: [instagram, tiktok, x, reddit, facebook, linkedin]

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OBSERVATORY_CONTACT: ${{ secrets.OBSERVATORY_CONTACT }}
      INSTAGRAM_SESSION_B64: ${{ secrets.INSTAGRAM_SESSION_B64 }}
      TIKTOK_SESSION_B64: ${{ secrets.TIKTOK_SESSION_B64 }}
      INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
      INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
      TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
      TIKTOK_PASSWORD: ${{ secrets.TIKTOK_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt -r requirements-browser.txt

      - name: Install the browser
        run: python -m playwright install --with-deps chromium

      - name: Try the backup
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -o pipefail
          python -m contentintel observatory sessions --what password-backup --key "$PLATFORM" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the attempt record
        if: always()
        run: |
          git config user.name "sessions-backup"
          git config user.email "sessions-backup@users.noreply.github.com"
          add_each() { for f in "$@"; do if [ -e "$f" ]; then git add -f "$f"; else echo "not written by this run (skipped): $f"; fi; done; }          # ONE `git add` of several paths is refused WHOLE when any one is missing, and `2>/dev/null || true` hid it: nothing was ever saved
          add_each data/_shared/session_password.json data/_shared/sessions_health.json
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Sessions password backup $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "--- files this run left changed but did not save (set aside for the pull, then put back):"
            git status --porcelain | head -40
            git pull --rebase --autostash
            git push
          fi
