# Collects competitor ads (Meta Ad Library, public pages), Instagram and TikTok posts (logged in as
# dummy accounts) and, when ticked, Gemini Deep Research reports (the Gemini web app, logged in as a
# dummy Google account, waiting the 10+ minutes a report takes), for the seeds in each brand's
# research.yaml, then adds them to each brand's Google Sheet (Collected tab).
# Runs every Wednesday by itself (ads and social only). To run it by hand: Actions > Collect > Run workflow.
# Pick a MODE:
#   plan                 shows what would be collected; opens no browser, spends nothing (the default)
#   seeds                has Claude write (or refresh) each brand's research seeds from its catalogue and shows them
#   check                opens each ticked site, confirms the login, collects a handful of items; with
#                        Deep Research ticked it also checks the Gemini page and Claude's key (no report started);
#                        it also proves the Google Doc for Deep Research reports can be written (DEEP_RESEARCH_DOC_ID)
#   benchmarks           looks now, with Serper and a reviewer, for the main Facebook page of every benchmark brand the Ad Library could not settle (no collection)
#   recon                saves pictures, page HTML and data samples (download the "debug" artifact)
#   test_deep_research   runs ONE real short Deep Research report, including Claude's prompt and answers
#   tidy                 collects nothing: tidies each brand's Idea Bank (removes copies, the brand's own content and items that
#                        are not relevant enough, moves their Drive folders to the trash and deletes their sheet rows), then
#                        updates the sheets
#   collect              the real run: saves data, updates the Google Sheets and adds each new Deep Research
#                        report to the Google Doc as a new tab, and puts each new ad or post in the brand's Idea Bank
#                        (scored by Claude, with its pictures and videos saved in the Shared Drive folder)
# Pick a BACKEND for ads and social: auto follows research.yaml (browser unless you switched Apify on),
# browser, apify (Apify only; needs APIFY_TOKEN), or fallback (browser first, Apify if it fails).
# Logins and keys come from repository secrets; the README lists every one.
name: Collect

on:
  schedule:
    - cron: "41 7 * * 3"          # Wednesdays 07:41 UTC
    - cron: "41 9 * * 3"          # and two later tries the same day: GitHub delays or skips scheduled runs under load (the 25 Nov 2026 run never fired), and a missed week is a ZERO in the forecast history.
    - cron: "41 11 * * 3"         # A later try does nothing when this week's Collect has already been saved (the guard job below)
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand folder name (for example swoveralls) or all"
        required: true
        default: "all"
      mode:
        description: "What to do"
        type: choice
        options: [plan, seeds, benchmarks, check, recon, test_deep_research, collect, rest, tidy]
        default: plan
      use_meta_ads:
        description: "Meta Ad Library ads (public pages, no login)"
        type: boolean
        default: true
      use_tiktok:
        description: "TikTok posts (dummy account)"
        type: boolean
        default: true
      use_instagram:
        description: "Instagram posts (dummy account)"
        type: boolean
        default: true
      use_deep_research:
        description: "Gemini Deep Research (dummy Google account; 10+ minutes per report)"
        type: boolean
        default: false
      region:
        description: "Where to look for competitor ads: worldwide, or a two-letter country code such as us (blank uses research.yaml, which says worldwide)"
        required: false
        default: ""
      rest_account:
        description: "Only for mode rest: which account to rest now, without opening it (instagram, tiktok, or instagram,tiktok)"
        required: false
        default: "instagram"
      rest_days:
        description: "Only for mode rest: how many days (blank uses the number in research.yaml)"
        required: false
        default: ""
      fresh:
        description: "Collect again now, ignoring what was collected in the last 3 days (item caps still apply; a source that refuses falls back as before)"
        type: boolean
        default: false
      ignore_cooldown:
        description: "Use accounts that are resting after an account warning (only once you have dealt with the warning); also skips the 12-hour gap between reads of an account for this run (the 2-pages-a-run and 4-a-day caps still apply)"
        type: boolean
        default: false
      backend:
        description: "How to collect ads and social posts"
        type: choice
        options: [auto, browser, apify, fallback, extra]
        default: auto

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.week.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Has this week's Collect already been saved?
        id: week
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A person starting Collect by hand always runs. A scheduled try runs only when no real Collect was saved in the last 5 days (the save commit is "Collect <date>").
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last="$(git log --since='5 days ago' --grep='^Collect ' --format='%h %cI' -1)"
          if [ -n "$last" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "This week's Collect was already saved ($last): this scheduled try does nothing."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No Collect was saved in the last 5 days: this scheduled try runs it."
          fi

  collect:
    needs: guard
    if: ${{ always() && (github.event_name != 'schedule' || needs.guard.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FREEAPI_ENCRYPTION_KEY: ${{ secrets.FREEAPI_ENCRYPTION_KEY }}
      FREEAPI_ADMIN_PASSWORD: ${{ secrets.FREEAPI_ADMIN_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
      ANYAPI_API_KEY: ${{ secrets.ANYAPI_API_KEY }}
      NAVY_API_KEY: ${{ secrets.NAVY_API_KEY }}
      API_AIRFORCE_API_KEY: ${{ secrets.API_AIRFORCE_API_KEY }}
      BLUESMINDS_API_KEY: ${{ secrets.BLUESMINDS_API_KEY }}
      BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt

      - run: pip install -r requirements.txt

      - name: Set up the free provider pool
        uses: ./.github/actions/ai-pool


      - name: Install ffmpeg (measures how each video moves; the runner does not have it; the run FAILS if it cannot be installed)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break
            echo "ffmpeg install attempt $attempt failed"
            sleep 5
          done
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || { echo "ffmpeg or ffprobe is missing after 3 attempts: failing this run"; exit 1; }
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Remember the downloaded browser
        if: inputs.mode != 'plan' && inputs.mode != 'seeds' && inputs.mode != 'benchmarks'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-browser.txt') }}

      - name: Install the browser
        if: inputs.mode != 'plan' && inputs.mode != 'seeds' && inputs.mode != 'benchmarks'
        shell: bash
        run: |
          pip install -r requirements-browser.txt
          for attempt in 1 2 3; do
            if playwright install --with-deps chromium; then
              # the stealth layer's own browser build and a private X server for the headed mode; neither is needed for a plain read, so a failure here is a warning, not a stop
              patchright install chromium || echo "::warning::The patchright browser could not be installed: the stealth layer uses its other engines."
              sudo apt-get install -y -qq xvfb || echo "::warning::Xvfb could not be installed: the stealth layer runs patchright headless."
              exit 0
            fi
            echo "The browser download failed (try $attempt of 3); trying again in 20 seconds"
            sleep 20
          done
          echo "::error::The browser could not be downloaded after 3 tries. Run the workflow again."
          exit 1

      - name: Collect
        id: collect
        if: inputs.mode != 'tidy'
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          USE_META_ADS: ${{ inputs.use_meta_ads }}
          USE_TIKTOK: ${{ inputs.use_tiktok }}
          USE_INSTAGRAM: ${{ inputs.use_instagram }}
          USE_DEEP_RESEARCH: ${{ inputs.use_deep_research }}
          MODE: ${{ inputs.mode }}
          BACKEND: ${{ inputs.backend }}
          REGION: ${{ inputs.region }}
          IGNORE_COOLDOWN: ${{ inputs.ignore_cooldown }}
          FRESH: ${{ inputs.fresh }}
          REST_ACCOUNT: ${{ inputs.rest_account }}
          REST_DAYS: ${{ inputs.rest_days }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          TIKTOK_PASSWORD: ${{ secrets.TIKTOK_PASSWORD }}
          GEMINI_COOKIES: ${{ secrets.GEMINI_COOKIES }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TOKEN_2: ${{ secrets.APIFY_TOKEN_2 }}
          APIFY_TOKEN_3: ${{ secrets.APIFY_TOKEN_3 }}
          APIFY_TOKEN_4: ${{ secrets.APIFY_TOKEN_4 }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          set +e
          args=(--all)
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args=(--brand "$BRAND"); fi
          sources=""
          if [ "$USE_META_ADS" != "false" ]; then sources="$sources,meta_ads"; fi
          if [ "$USE_TIKTOK" != "false" ]; then sources="$sources,tiktok"; fi
          if [ "$USE_INSTAGRAM" != "false" ]; then sources="$sources,instagram"; fi
          if [ "$USE_DEEP_RESEARCH" = "true" ]; then sources="$sources,deep_research"; fi
          MODE="${MODE:-collect}"              # the weekly schedule has no inputs: it is a real run
          if [ "$MODE" != "test_deep_research" ] && [ "$MODE" != "seeds" ] && [ "$MODE" != "benchmarks" ] && [ "$MODE" != "rest" ] && [ -z "$sources" ]; then echo "No collector was ticked; nothing to do."; exit 0; fi
          case "$MODE" in
            plan)               args+=(--sources "${sources#,}" --dry-run) ;;
            seeds)              args+=(--seeds) ;;
            benchmarks)         args=(--find-pages) ;;
            check)              args=(--check --sources "${sources#,}") ;;
            recon)              args=(--recon --sources "${sources#,}") ;;
            test_deep_research) args=(--test-deep-research) ;;
            collect)            args+=(--sources "${sources#,}") ;;
            rest)               args=(--rest "${REST_ACCOUNT:-instagram}"); if [ -n "$REST_DAYS" ]; then args+=(--rest-days "$REST_DAYS"); fi ;;
            *) echo "Unknown mode: $MODE"; exit 1 ;;
          esac
          args+=(--backend "${BACKEND:-auto}")
          if [ -n "$REGION" ]; then args+=(--region "$REGION"); fi
          if [ "$IGNORE_COOLDOWN" = "true" ]; then args+=(--ignore-cooldown); fi
          if [ "$FRESH" = "true" ] && [ "$MODE" = "collect" ]; then args+=(--fresh); fi
          { echo "### Collect"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel collect "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Keep the pictures and page samples
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug
          path: debug
          if-no-files-found: ignore
          retention-days: 14

      - name: Add new items to the Idea Bank
        id: ideabank
        if: inputs.mode == 'collect' || inputs.mode == '' || inputs.mode == 'tidy'
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          MODE: ${{ inputs.mode }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          IDEA_BANK_FOLDER_ID: ${{ secrets.IDEA_BANK_FOLDER_ID }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: |
          set +e
          args=(--all)
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args=(--brand "$BRAND"); fi
          if [ "$MODE" = "tidy" ]; then args+=(--audit); fi
          { echo "### Idea Bank"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel ideabank "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Check the Idea Bank Drive folder
        id: ideabankcheck
        if: inputs.mode == 'check'
        continue-on-error: true
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          IDEA_BANK_FOLDER_ID: ${{ secrets.IDEA_BANK_FOLDER_ID }}
        run: |
          set +e
          { echo "### Idea Bank Drive check"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel ideabank --check 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Update Google Sheets
        id: sheets
        if: inputs.mode == 'collect' || inputs.mode == '' || inputs.mode == 'tidy'
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_SHARE_EMAIL: ${{ secrets.SHEET_SHARE_EMAIL }}
          SHEET_FOLDER_ID: ${{ secrets.SHEET_FOLDER_ID }}
        run: |
          set +e
          args=(--all)
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args=(--brand "$BRAND"); fi
          { echo "### Google Sheets"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel sheets "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Add Deep Research reports to the Google Doc
        id: docs
        if: inputs.mode == 'collect' || inputs.mode == ''
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DEEP_RESEARCH_DOC_ID: ${{ secrets.DEEP_RESEARCH_DOC_ID }}
        run: |
          set +e
          args=(--all)
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args=(--brand "$BRAND"); fi
          { echo "### Google Doc (Deep Research reports)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel docs "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Check the Google Doc for Deep Research reports
        id: docscheck
        if: inputs.mode == 'check'
        continue-on-error: true
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DEEP_RESEARCH_DOC_ID: ${{ secrets.DEEP_RESEARCH_DOC_ID }}
        run: |
          set +e
          { echo "### Google Doc check"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel docs --all --check 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Save the data
        if: always()
        shell: bash
        run: |
          git config user.name "catalogue-collect"
          git config user.email "catalogue-collect@users.noreply.github.com"
          git add -f data
          git reset -q -- data/_shared/stealth-profiles 2>/dev/null || true          # a browser profile (session cookies) is never committed: the profile directory is .stealth-profiles, outside data/; this line also unstages the OLD default path if a copy still uses it
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Collect $(date -u +%Y-%m-%dT%H:%MZ)"
            bash .github/scripts/push-with-retry.sh
          fi

      - name: Keep the unsaved data (only when the save failed)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unsaved-data
          path: unsaved-data/
          if-no-files-found: ignore
          retention-days: 14
      - name: Alert if collection needs attention
        if: steps.collect.outcome == 'failure' || steps.sheets.outcome == 'failure' || steps.docs.outcome == 'failure' || steps.docscheck.outcome == 'failure' || steps.ideabank.outcome == 'failure' || steps.ideabankcheck.outcome == 'failure'
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"Collection needs attention: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi

      - name: Show the run as red when attention is needed
        if: steps.collect.outcome == 'failure' || steps.sheets.outcome == 'failure' || steps.docs.outcome == 'failure' || steps.docscheck.outcome == 'failure' || steps.ideabank.outcome == 'failure' || steps.ideabankcheck.outcome == 'failure'
        run: exit 1
