# Collects competitor ads (Meta Ad Library, public pages), Instagram and TikTok posts (logged in as
# dummy accounts) and, when ticked, Gemini Deep Research reports (the Gemini web app, logged in as a
# dummy Google account, waiting the 10+ minutes a report takes), for the seeds in each brand's
# research.yaml, then adds them to each brand's Google Sheet (Collected tab).
# Runs every Wednesday by itself (ads and social only). To run it by hand: Actions > Collect > Run workflow.
# Pick a MODE:
#   plan                 shows what would be collected; opens no browser, spends nothing (the default)
#   seeds                has Claude write (or refresh) each brand's research seeds from its catalogue and shows them
#   check                opens each ticked site, confirms the login, collects a handful of items; with
#                        Deep Research ticked it also checks the Gemini page and Claude's key (no report started);
#                        it also proves the Google Doc for Deep Research reports can be written (DEEP_RESEARCH_DOC_ID)
#   recon                saves pictures, page HTML and data samples (download the "debug" artifact)
#   test_deep_research   runs ONE real short Deep Research report, including Claude's prompt and answers
#   collect              the real run: saves data, updates the Google Sheets and adds each new Deep Research
#                        report to the Google Doc as a new tab
# Pick a BACKEND for ads and social: auto follows research.yaml (browser unless you switched Apify on),
# browser, apify (Apify only; needs APIFY_TOKEN), or fallback (browser first, Apify if it fails).
# Logins and keys come from repository secrets; the README lists every one.
name: Collect

on:
  schedule:
    - cron: "41 7 * * 3"          # Wednesdays 07:41 UTC
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand folder name (for example swoveralls) or all"
        required: true
        default: "all"
      mode:
        description: "What to do"
        type: choice
        options: [plan, seeds, check, recon, test_deep_research, collect]
        default: plan
      use_meta_ads:
        description: "Meta Ad Library ads (public pages, no login)"
        type: boolean
        default: true
      use_tiktok:
        description: "TikTok posts (dummy account)"
        type: boolean
        default: true
      use_instagram:
        description: "Instagram posts (dummy account)"
        type: boolean
        default: true
      use_deep_research:
        description: "Gemini Deep Research (dummy Google account; 10+ minutes per report)"
        type: boolean
        default: false
      backend:
        description: "How to collect ads and social posts"
        type: choice
        options: [auto, browser, apify, fallback]
        default: auto

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt

      - run: pip install -r requirements.txt

      - name: Remember the downloaded browser
        if: inputs.mode != 'plan' && inputs.mode != 'seeds'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-browser.txt') }}

      - name: Install the browser
        if: inputs.mode != 'plan' && inputs.mode != 'seeds'
        shell: bash
        run: |
          pip install -r requirements-browser.txt
          for attempt in 1 2 3; do
            if playwright install --with-deps chromium; then exit 0; fi
            echo "The browser download failed (try $attempt of 3); trying again in 20 seconds"
            sleep 20
          done
          echo "::error::The browser could not be downloaded after 3 tries. Run the workflow again."
          exit 1

      - name: Collect
        id: collect
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          USE_META_ADS: ${{ inputs.use_meta_ads }}
          USE_TIKTOK: ${{ inputs.use_tiktok }}
          USE_INSTAGRAM: ${{ inputs.use_instagram }}
          USE_DEEP_RESEARCH: ${{ inputs.use_deep_research }}
          MODE: ${{ inputs.mode }}
          BACKEND: ${{ inputs.backend }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          TIKTOK_PASSWORD: ${{ secrets.TIKTOK_PASSWORD }}
          GEMINI_COOKIES: ${{ secrets.GEMINI_COOKIES }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          set +e
          args=(--all)
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args=(--brand "$BRAND"); fi
          sources=""
          if [ "$USE_META_ADS" != "false" ]; then sources="$sources,meta_ads"; fi
          if [ "$USE_TIKTOK" != "false" ]; then sources="$sources,tiktok"; fi
          if [ "$USE_INSTAGRAM" != "false" ]; then sources="$sources,instagram"; fi
          if [ "$USE_DEEP_RESEARCH" = "true" ]; then sources="$sources,deep_research"; fi
          MODE="${MODE:-collect}"              # the weekly schedule has no inputs: it is a real run
          if [ "$MODE" != "test_deep_research" ] && [ "$MODE" != "seeds" ] && [ -z "$sources" ]; then echo "No collector was ticked; nothing to do."; exit 0; fi
          case "$MODE" in
            plan)               args+=(--sources "${sources#,}" --dry-run) ;;
            seeds)              args+=(--seeds) ;;
            check)              args=(--check --sources "${sources#,}") ;;
            recon)              args=(--recon --sources "${sources#,}") ;;
            test_deep_research) args=(--test-deep-research) ;;
            collect)            args+=(--sources "${sources#,}") ;;
            *) echo "Unknown mode: $MODE"; exit 1 ;;
          esac
          args+=(--backend "${BACKEND:-auto}")
          { echo "### Collect"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel collect "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Keep the pictures and page samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug
          if-no-files-found: ignore
          retention-days: 14

      - name: Update Google Sheets
        id: sheets
        if: inputs.mode == 'collect' || inputs.mode == ''
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_SHARE_EMAIL: ${{ secrets.SHEET_SHARE_EMAIL }}
          SHEET_FOLDER_ID: ${{ secrets.SHEET_FOLDER_ID }}
        run: |
          set +e
          args=(--all)
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args=(--brand "$BRAND"); fi
          { echo "### Google Sheets"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel sheets "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Add Deep Research reports to the Google Doc
        id: docs
        if: inputs.mode == 'collect' || inputs.mode == ''
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DEEP_RESEARCH_DOC_ID: ${{ secrets.DEEP_RESEARCH_DOC_ID }}
        run: |
          set +e
          args=(--all)
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args=(--brand "$BRAND"); fi
          { echo "### Google Doc (Deep Research reports)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel docs "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Check the Google Doc for Deep Research reports
        id: docscheck
        if: inputs.mode == 'check'
        continue-on-error: true
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DEEP_RESEARCH_DOC_ID: ${{ secrets.DEEP_RESEARCH_DOC_ID }}
        run: |
          set +e
          { echo "### Google Doc check"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel docs --all --check 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Save the data
        shell: bash
        run: |
          git config user.name "catalogue-collect"
          git config user.email "catalogue-collect@users.noreply.github.com"
          git add -f data
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Collect $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      - name: Alert if collection needs attention
        if: steps.collect.outcome == 'failure' || steps.sheets.outcome == 'failure' || steps.docs.outcome == 'failure' || steps.docscheck.outcome == 'failure'
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"Collection needs attention: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi

      - name: Show the run as red when attention is needed
        if: steps.collect.outcome == 'failure' || steps.sheets.outcome == 'failure' || steps.docs.outcome == 'failure' || steps.docscheck.outcome == 'failure'
        run: exit 1
