# Collects competitor ads (Meta Ad Library, public pages), Instagram and TikTok posts (logged in as
# dummy accounts) and, when ticked, Gemini Deep Research reports (the Gemini web app, logged in as a
# dummy Google account, waiting the 10+ minutes a report takes), for the seeds in each brand's
# research.yaml, then adds them to each brand's Google Sheet (Collected tab).
# Runs every Wednesday by itself (ads and social only). To run it now: Actions > Collect > Run workflow.
#   Dry run (ticked by default): shows the plan, opens no browser.
#   Check: opens each ticked site, confirms the login, and collects a handful of items.
#   Recon: saves pictures, page HTML and data samples from each site. Download them from the run's
#          "debug" artifact; they show exactly what to change in browser.yaml.
# Logins come from repository secrets holding the dummy accounts' cookies; see browser.yaml.
name: Collect

on:
  schedule:
    - cron: "41 7 * * 3"          # Wednesdays 07:41 UTC
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand folder name (for example swoveralls) or all"
        required: true
        default: "all"
      use_meta_ads:
        description: "Meta Ad Library ads (public pages, no login)"
        type: boolean
        default: true
      use_tiktok:
        description: "TikTok posts (dummy account)"
        type: boolean
        default: true
      use_instagram:
        description: "Instagram posts (dummy account)"
        type: boolean
        default: true
      use_deep_research:
        description: "Gemini Deep Research (dummy Google account; takes 10+ minutes per report)"
        type: boolean
        default: false
      check:
        description: "Open each ticked site, confirm the login, collect a handful (ignores Dry run)"
        type: boolean
        default: false
      recon:
        description: "Save pictures, page HTML and data samples for tuning (ignores Dry run)"
        type: boolean
        default: false
      dry_run:
        description: "Show the plan and open no browser"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt

      - run: pip install -r requirements.txt

      - name: Install the browser
        if: inputs.dry_run != true || inputs.check == true || inputs.recon == true
        run: |
          pip install -r requirements-browser.txt
          playwright install --with-deps chromium

      - name: Collect
        id: collect
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          USE_META_ADS: ${{ inputs.use_meta_ads }}
          USE_TIKTOK: ${{ inputs.use_tiktok }}
          USE_INSTAGRAM: ${{ inputs.use_instagram }}
          USE_DEEP_RESEARCH: ${{ inputs.use_deep_research }}
          CHECK: ${{ inputs.check }}
          RECON: ${{ inputs.recon }}
          DRY_RUN: ${{ inputs.dry_run }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          TIKTOK_PASSWORD: ${{ secrets.TIKTOK_PASSWORD }}
          GEMINI_COOKIES: ${{ secrets.GEMINI_COOKIES }}
        run: |
          set +e
          args=(--all)
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args=(--brand "$BRAND"); fi
          sources=""
          if [ "$USE_META_ADS" != "false" ]; then sources="$sources,meta_ads"; fi
          if [ "$USE_TIKTOK" != "false" ]; then sources="$sources,tiktok"; fi
          if [ "$USE_INSTAGRAM" != "false" ]; then sources="$sources,instagram"; fi
          if [ "$USE_DEEP_RESEARCH" = "true" ]; then sources="$sources,deep_research"; fi
          if [ -z "$sources" ]; then echo "No collector was ticked; nothing to do."; exit 0; fi
          if [ "$RECON" = "true" ]; then
            args=(--recon --sources "${sources#,}")
          elif [ "$CHECK" = "true" ]; then
            args=(--check --sources "${sources#,}")
          else
            args+=(--sources "${sources#,}")
            if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          fi
          { echo "### Collect"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel collect "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Keep the pictures and page samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug
          if-no-files-found: ignore
          retention-days: 14

      - name: Update Google Sheets
        id: sheets
        if: inputs.dry_run != true && inputs.check != true && inputs.recon != true
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_SHARE_EMAIL: ${{ secrets.SHEET_SHARE_EMAIL }}
          SHEET_FOLDER_ID: ${{ secrets.SHEET_FOLDER_ID }}
        run: |
          set +e
          args=(--all)
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args=(--brand "$BRAND"); fi
          { echo "### Google Sheets"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel sheets "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Save the data
        shell: bash
        run: |
          git config user.name "catalogue-collect"
          git config user.email "catalogue-collect@users.noreply.github.com"
          git add -f data
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Collect $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      - name: Alert if collection needs attention
        if: steps.collect.outcome == 'failure' || steps.sheets.outcome == 'failure'
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"Collection needs attention: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi

      - name: Show the run as red when attention is needed
        if: steps.collect.outcome == 'failure' || steps.sheets.outcome == 'failure'
        run: exit 1
