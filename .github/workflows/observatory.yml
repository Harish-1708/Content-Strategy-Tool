# The research observatory: competitor stores, sitemaps, feeds and pages read politely; automatic competitor discovery; the YouTube and public-content corpus.
#
# Actions > Observatory > Run workflow.
#   plan       shows what is watched and what is missing. Makes no request.
#   discover   finds competitors in everything already collected (and looks up their websites within the search credit caps)
#   decide     your choice about a discovered competitor: monitor, stop, or reset (fill in competitor and decision). You can also type monitor or stop in the
#              Decision column of the Competitors tab; the next sheet update reads it.
#   monitor    reads every watched competitor, stores dated snapshots, writes change events and a report
#   corpus     YouTube (needs the YOUTUBE_API_KEY secret), the outlier ranking, a search of the whole corpus, or reading one page through Jina Reader
#   report / status / history / prune   read what was stored
#
# It also runs by itself every Monday (monitor), so competitor changes are found weekly without anyone starting it.
#
# REQUIRED SECRET: OBSERVATORY_CONTACT, your business email address or contact-page address. The tool names itself honestly in its requests and will not read without it.
# Optional secrets: YOUTUBE_API_KEY, EXA_API_KEY, JINA_API_KEY (raises Jina's free limit), the search keys, and for sites we own or are authorised to use:
# proxy and cookie secrets (add each one to the env block below; see docs/observatory/README.md, "Advanced access").
name: Observatory

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [plan, discover, decide, judge, monitor, corpus, instagram, reddit, agentreach, reliability, controls, connections, report, status, history, prune]
        default: plan
      brand:
        description: "Brand (blank: every brand)"
        required: false
        default: ""
      only:
        description: "monitor: only these parts (pages, feeds, sitemap, shopify; comma-separated)"
        required: false
        default: ""
      competitor:
        description: "monitor: only these competitor ids (comma-separated). decide: the competitor's key or website"
        required: false
        default: ""
      decision:
        description: "decide: monitor, stop or reset"
        type: choice
        options: [monitor, stop, reset]
        default: monitor
      what:
        description: "corpus, instagram, reddit, judge, agentreach, controls: what to do (each action uses the ones that apply to it and falls back to its usual default for the rest)"
        type: choice
        options: [youtube, outliers, search, stats, read, deepread, channelpages, crawl, feeds, trending, collect, compare, check, run, list, approve, reject, show, set, reset, subtitle, profile, posts, tweets, thread, jobs, subreddit, health, install]
        default: youtube
      route:
        description: "reddit: which route (all, api, agent_reach)"
        type: choice
        options: [all, api, agent_reach]
        default: all
      subreddit:
        description: "reddit: extra communities (comma-separated)"
        required: false
        default: ""
      ar_channel:
        description: "agentreach: the Agent-Reach channel. youtube, github and web run anywhere; the others need OpenCLI and a logged-in browser on a machine you control, never a hosted runner"
        type: choice
        options: [instagram, reddit, youtube, twitter, facebook, linkedin, xiaohongshu, boss, github, web]
        default: youtube
      engine:
        description: "corpus read, deepread, channelpages: the page reader (central: whatever the Controls say for that purpose)"
        type: choice
        options: [central, jina, core, scrapling, auto]
        default: central
      top:
        description: "corpus deepread: how many search-result pages to read; corpus crawl: how many pages at most (the crawl.max_pages setting is the limit when blank)"
        required: false
        default: "5"
      extra:
        description: "agentreach: extra inputs as name=value, separated by semicolons (location=Austin for LinkedIn jobs, city=Shanghai for Boss); corpus crawl: depth=N (how many links deep), sitemap=true, resume=true, extract=name=css:.selector (css, xpath, text, regex or similar)"
        required: false
        default: ""
      key:
        description: "controls set/reset: the control's key (run controls first to list them)"
        required: false
        default: ""
      value:
        description: "controls set: the new value (on, off, a number, text or a choice)"
        required: false
        default: ""
      platform:
        description: "reliability: instagram, tiktok or reddit"
        type: choice
        options: [instagram, tiktok, reddit]
        default: instagram
      query:
        description: "corpus search: the words to look for"
        required: false
        default: ""
      url:
        description: "corpus read: a public page to read through Jina Reader"
        required: false
        default: ""
      channels:
        description: "corpus youtube: extra channels (@handle or id, comma-separated)"
        required: false
        default: ""
      find_channels:
        description: "corpus youtube: also search for channels (each search uses 100 of the free daily units)"
        type: boolean
        default: false
      site:
        description: "history: the competitor id"
        required: false
        default: ""
      product:
        description: "history: a product handle or id"
        required: false
        default: ""
      scrapling:
        description: "Read pages with the isolated Scrapling worker instead of the built-in reader"
        type: boolean
        default: false
      browsers:
        description: "Also download Scrapling's browsers (needed by any competitor or setting that uses the browser)"
        type: boolean
        default: false

permissions:
  contents: write
  models: read               # lets the job's own token call GitHub Models (free, no card) for the AI layer; nothing else is granted

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  observatory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-scrapling.txt

      - run: pip install -r requirements.txt

      - name: Check the required contact secret
        if: ${{ !contains(fromJSON('["plan","report","status","history","prune","decide"]'), inputs.action || 'monitor') }}
        shell: bash
        env:
          OBSERVATORY_CONTACT: ${{ secrets.OBSERVATORY_CONTACT }}
        run: |
          if [ -z "$OBSERVATORY_CONTACT" ]; then
            echo "::er""ror::The secret OBSERVATORY_CONTACT is missing. Add your business email address or contact-page address under Settings > Secrets and variables > Actions. The tool identifies itself honestly in its requests and will not read without it."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: ${{ inputs.action == 'discover' || inputs.action == 'judge' }}
        with:
          node-version: "22"

      - name: Fetch and build the gateway (discover and judge use the AI layer)
        if: ${{ inputs.action == 'discover' || inputs.action == 'judge' }}
        continue-on-error: true
        shell: bash
        run: |
          # the FreeLLMAPI connection: the newest release by default; the recorded commit is the fallback if that cannot be built. If neither builds, the AI layer reports it and the run goes on without it.
          export CONTENTINTEL_GATEWAY_DIR=gateway-src
          if ! python -m contentintel observatory connections --all --what install --key freellmapi; then
            echo "::warning::The newest gateway could not be built here; using the recorded one"
            rm -rf gateway-src
            commit=$(python -c "import json;print(json.load(open('ai/gateway.lock.json'))['gateway']['commit'])")
            mkdir gateway-src && cd gateway-src
            git init --quiet
            git remote add origin https://github.com/tashfeenahmed/freellmapi
            git fetch --quiet --depth 1 origin "$commit"
            git checkout --quiet FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$commit" || { echo "::error::The fetched gateway is not the pinned commit"; exit 1; }
            npm ci --workspace=shared --workspace=server --include-workspace-root --no-audit --no-fund
            npm run build -w server
          fi

      - name: Install or update the Agent-Reach connection (the repository itself)
        if: ${{ inputs.action == 'agentreach' }}
        continue-on-error: true
        shell: bash
        run: |
          python -m contentintel observatory connections --all --what install --key agent_reach 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install the isolated Scrapling environment
        if: ${{ inputs.scrapling || inputs.browsers || (inputs.action == 'corpus' && (inputs.what == 'crawl' || inputs.what == 'deepread')) || (inputs.action == 'connections' && (inputs.what == 'check' || inputs.what == 'install')) }}
        shell: bash
        run: |
          export CONTENTINTEL_EXTERNAL_DIR="$RUNNER_TEMP"
          # the Scrapling connection: the newest version by default (the owner can pin it); the recorded version is the fallback if that cannot be installed
          python -m contentintel observatory connections --all --what install --key scrapling || true
          if [ ! -x "$RUNNER_TEMP/scrapling-env/bin/python" ]; then
            python -m venv "$RUNNER_TEMP/scrapling-env"
            "$RUNNER_TEMP/scrapling-env/bin/pip" install -q -r requirements-scrapling.txt
          fi
          echo "SCRAPLING_PYTHON=$RUNNER_TEMP/scrapling-env/bin/python" >> "$GITHUB_ENV"
          if [ "${{ inputs.browsers }}" = "true" ]; then
            "$RUNNER_TEMP/scrapling-env/bin/python" -m playwright install --with-deps chromium
          fi

      - name: Run
        id: run
        continue-on-error: true
        shell: bash
        env:
          ACTION: ${{ inputs.action || 'monitor' }}
          BRAND: ${{ inputs.brand }}
          ONLY: ${{ inputs.only }}
          COMPETITOR: ${{ inputs.competitor }}
          WHAT: ${{ inputs.what }}
          DECISION: ${{ inputs.decision }}
          QUERY: ${{ inputs.query }}
          URL: ${{ inputs.url }}
          CHANNELS: ${{ inputs.channels }}
          FIND: ${{ inputs.find_channels }}
          SITE: ${{ inputs.site }}
          PRODUCT: ${{ inputs.product }}
          SCRAPLING: ${{ inputs.scrapling }}
          ROUTE: ${{ inputs.route }}
          SUBREDDIT: ${{ inputs.subreddit }}
          AR_CHANNEL: ${{ inputs.ar_channel }}
          ENGINE: ${{ inputs.engine }}
          KEY: ${{ inputs.key }}
          VALUE: ${{ inputs.value }}
          TOP: ${{ inputs.top }}
          EXTRA: ${{ inputs.extra }}
          PLATFORM: ${{ inputs.platform }}
          OBSERVATORY_CONTACT: ${{ secrets.OBSERVATORY_CONTACT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_MCP: "on"
          AGENT_REACH_SEARCH: "on"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}           # the AI layer (discover and judge): Claude, the free gateway providers and GitHub Models
          FREEAPI_ENCRYPTION_KEY: ${{ secrets.FREEAPI_ENCRYPTION_KEY }}
          FREEAPI_ADMIN_PASSWORD: ${{ secrets.FREEAPI_ADMIN_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}         # optional: a fine-grained token with Models: read for the AI layer; used before the job's own token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}           # raises GitHub's public-API limit for Agent-Reach's GitHub channel, and is the credential for GitHub Models in the AI layer (the job has models: read). Only raises GitHub's public-API limit for Agent-Reach's GitHub channel; the client sends it to api.github.com and nowhere else
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # A proxy address or account cookies for any competitor (advanced.proxy, advanced.cookies_env in its brand file), or central defaults and overrides (services: in observatory.yaml),
          # are passed here, one line per secret, under the secret's own name. docs/observatory/README.md ("Request controls") shows the exact lines.
        run: |
          set +e
          args=("$ACTION")
          if [ -n "$BRAND" ]; then args+=(--brand "$BRAND"); else args+=(--all); fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ -n "$COMPETITOR" ]; then args+=(--competitor "$COMPETITOR"); fi
          if [ "$ACTION" = "corpus" ]; then
            args+=(--what "$WHAT")
            if [ -n "$QUERY" ]; then args+=(--query "$QUERY"); fi
            if [ -n "$URL" ]; then args+=(--url "$URL"); fi
            if [ -n "$CHANNELS" ]; then args+=(--channel "$CHANNELS"); fi
            if [ "$FIND" = "true" ]; then args+=(--find-channels); fi
            if [ "$ENGINE" != "central" ]; then args+=(--engine "$ENGINE"); fi
            if [ "$WHAT" = "deepread" ]; then args+=(--top "$TOP"); fi
            if [ "$WHAT" = "crawl" ]; then
              args+=(--max-pages "$TOP")
              IFS=';' read -ra parts <<< "$EXTRA"
              for part in "${parts[@]}"; do
                case "$part" in
                  depth=*) args+=(--depth "${part#depth=}") ;;
                  sitemap=true) args+=(--sitemap) ;;
                  resume=true) args+=(--resume) ;;
                  extract=*) args+=(--extract "${part#extract=}") ;;
                esac
              done
            fi
          fi
          case "$ACTION" in instagram|reddit|judge|agentreach|controls) args+=(--what "$WHAT") ;; esac
          if [ "$ACTION" = "reddit" ]; then
            args+=(--route "$ROUTE")
            if [ -n "$SUBREDDIT" ]; then args+=(--subreddit "$SUBREDDIT"); fi
            if [ -n "$QUERY" ]; then args+=(--query "$QUERY"); fi
          fi
          if [ "$ACTION" = "agentreach" ]; then
            args+=(--ar-channel "$AR_CHANNEL")
            if [ -n "$QUERY" ]; then args+=(--query "$QUERY"); fi
            if [ -n "$URL" ]; then args+=(--url "$URL"); fi
            IFS=';' read -ra parts <<< "$EXTRA"
            for part in "${parts[@]}"; do if [ -n "$part" ]; then args+=(--param "$part"); fi; done
          fi
          if [ "$ACTION" = "controls" ]; then
            if [ -n "$KEY" ]; then args+=(--key "$KEY"); fi
            if [ -n "$VALUE" ]; then args+=(--value "$VALUE"); fi
          fi
          if [ "$ACTION" = "reliability" ]; then args+=(--platform "$PLATFORM"); fi
          if [ "$ACTION" = "decide" ]; then args+=(--decision "$DECISION"); fi
          if [ "$ACTION" = "history" ]; then
            if [ -n "$SITE" ]; then args+=(--site "$SITE"); fi
            if [ -n "$PRODUCT" ]; then args+=(--product "$PRODUCT"); fi
          fi
          if [ "$SCRAPLING" = "true" ]; then export OBSERVATORY_ENGINE_PAGES=scrapling; fi
          { echo "### Observatory: $ACTION"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel observatory "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Show the health of every route
        if: ${{ (inputs.action || 'monitor') != 'plan' }}
        shell: bash
        run: |
          { echo "### Collector health"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel health 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save the data
        if: ${{ !contains(fromJSON('["plan","report","status","history"]'), inputs.action || 'monitor') }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Observatory $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q || true
            git push
          fi

      - name: Update Google Sheets
        id: sheets
        if: ${{ !contains(fromJSON('["plan","report","status","history","prune"]'), inputs.action || 'monitor') }}
        continue-on-error: true
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_SHARE_EMAIL: ${{ secrets.SHEET_SHARE_EMAIL }}
          SHEET_FOLDER_ID: ${{ secrets.SHEET_FOLDER_ID }}
        run: |
          set +e
          args=()
          if [ -n "${{ inputs.brand }}" ]; then args+=(--brand "${{ inputs.brand }}"); else args+=(--all); fi
          { echo "### Google Sheets"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel sheets "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Fail the run if the observatory had problems
        if: ${{ steps.run.outcome == 'failure' }}
        run: |
          echo "::error::The observatory step reported a problem; see the summary above."
          exit 1
