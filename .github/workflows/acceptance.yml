# Proves, from GitHub's own servers, that each source and route really answers.
#
# Unit tests prove the code handles an answer correctly; they cannot prove TikTok, Instagram, YouTube or a search
# service still talk to a GitHub server. This workflow makes ONE small real call per route, records exactly what
# happened (time, version, route, how many items, the error code) in data/_shared/acceptance.jsonl, and updates the
# health ledger. A route is shown as healthy on the Collector Health tab only after one of these has passed.
#
# Runs every Thursday by itself. To run it by hand: Actions > Acceptance > Run workflow.
#   only   limit it to some sources, comma-separated (meta_ads, tiktok, instagram, deep_research, web_search,
#          shopify_catalogue, youtube_public, claude). Blank checks every source that has what it needs.
#   plan   show what would be checked and what is missing (a missing secret, for example); make no call at all.
#   brand  which brand's public catalogue feed is tried (blank: the first brand).
#   clear  sources whose rest period is lifted first, comma-separated (for example: tiktok,instagram,deep_research). A route that
#          failed rests (12 hours after a login problem, a day after a block) and an acceptance run SKIPS a resting route, so use this
#          after you have fixed the cause (fresh cookies, a new key) and want to test straight away.
# A route that is resting after a block is skipped, never asked again. A route whose secret is missing is
# reported as skipped, not failed.
# It uses a few collector items and a few search credits (counted in the usual caps), and one Claude call.
# This workflow sends no Slack message; a failed route turns the run red.
name: Acceptance

on:
  schedule:
    - cron: "17 6 * * 4"          # Thursdays 06:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Only these sources, comma-separated (blank: every source that has what it needs)"
        required: false
        default: ""
      plan:
        description: "Show what would be checked and what is missing; make no call"
        type: boolean
        default: false
      brand:
        description: "Brand whose public catalogue feed is tried (blank: the first brand)"
        required: false
        default: ""
      clear:
        description: "Lift the rest period of these sources first, comma-separated (after you have fixed the cause)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FREEAPI_ENCRYPTION_KEY: ${{ secrets.FREEAPI_ENCRYPTION_KEY }}
      FREEAPI_ADMIN_PASSWORD: ${{ secrets.FREEAPI_ADMIN_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
      ANYAPI_API_KEY: ${{ secrets.ANYAPI_API_KEY }}
      NAVY_API_KEY: ${{ secrets.NAVY_API_KEY }}
      API_AIRFORCE_API_KEY: ${{ secrets.API_AIRFORCE_API_KEY }}
      BLUESMINDS_API_KEY: ${{ secrets.BLUESMINDS_API_KEY }}
      BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt

      - run: pip install -r requirements.txt

      - name: Set up the free provider pool
        uses: ./.github/actions/ai-pool

      - name: Remember the downloaded browser
        if: inputs.plan != true
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-browser.txt') }}

      - name: Install the browser
        if: inputs.plan != true
        shell: bash
        run: |
          pip install -r requirements-browser.txt
          for attempt in 1 2 3; do
            if playwright install --with-deps chromium; then
              # the stealth layer's own browser build and a private X server for the headed mode; neither is needed for a plain read, so a failure here is a warning, not a stop
              patchright install chromium || echo "::warning::The patchright browser could not be installed: the stealth layer uses its other engines."
              sudo apt-get install -y -qq xvfb || echo "::warning::Xvfb could not be installed: the stealth layer runs patchright headless."
              exit 0
            fi
            echo "The browser download failed (try $attempt of 3); trying again in 20 seconds"
            sleep 20
          done
          echo "::error::The browser could not be downloaded after 3 tries. Run the workflow again."
          exit 1

      - name: Lift rest periods you asked to lift
        if: inputs.clear != '' && inputs.plan != true
        shell: bash
        env:
          CLEAR: ${{ inputs.clear }}
        run: |
          IFS=',' read -ra sources <<< "$CLEAR"
          for s in "${sources[@]}"; do
            s=$(echo "$s" | tr -d '[:space:]')
            if [ -n "$s" ]; then python -m contentintel health --clear "$s"; fi
          done

      - name: Check each route
        id: acceptance
        continue-on-error: true
        shell: bash
        env:
          ONLY: ${{ inputs.only }}
          PLAN: ${{ inputs.plan }}
          BRAND: ${{ inputs.brand }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          TIKTOK_PASSWORD: ${{ secrets.TIKTOK_PASSWORD }}
          GEMINI_COOKIES: ${{ secrets.GEMINI_COOKIES }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TOKEN_2: ${{ secrets.APIFY_TOKEN_2 }}
          APIFY_TOKEN_3: ${{ secrets.APIFY_TOKEN_3 }}
          APIFY_TOKEN_4: ${{ secrets.APIFY_TOKEN_4 }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_MCP: "on"
          AGENT_REACH_SEARCH: "on"
          AGENT_REACH_URL: ${{ secrets.AGENT_REACH_URL }}
          AGENT_REACH_TOKEN: ${{ secrets.AGENT_REACH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OBSERVATORY_CONTACT: ${{ secrets.OBSERVATORY_CONTACT }}           # the contact address the competitor, Agent-Reach and Reddit checks put in their requests; without it they skip
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}                 # optional: empty while you have not added Reddit's API credentials, and the Reddit API check then skips as before
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}                  # lifts GitHub's anonymous search limit for the Agent-Reach GitHub check (the job's own token, read-only)
        run: |
          set +e
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ -n "$BRAND" ]; then args+=(--brand "$BRAND"); fi
          if [ "$PLAN" = "true" ]; then args+=(--plan); fi
          { echo "### Acceptance"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel acceptance "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Stored login sessions (live, each platform on its own)
        id: sessions
        if: inputs.plan != true
        continue-on-error: true
        shell: bash
        env:
          OBSERVATORY_CONTACT: ${{ secrets.OBSERVATORY_CONTACT }}
          # DUMMY accounts only, captured by hand (docs/platform/session-capture-guide.md). A platform without its secret is simply 'not set up': it is not a failure.
          INSTAGRAM_SESSION_B64: ${{ secrets.INSTAGRAM_SESSION_B64 }}
          X_SESSION_B64: ${{ secrets.X_SESSION_B64 }}
          TIKTOK_SESSION_B64: ${{ secrets.TIKTOK_SESSION_B64 }}
          REDDIT_SESSION_B64: ${{ secrets.REDDIT_SESSION_B64 }}
          FACEBOOK_SESSION_B64: ${{ secrets.FACEBOOK_SESSION_B64 }}
          LINKEDIN_SESSION_B64: ${{ secrets.LINKEDIN_SESSION_B64 }}
          XIAOHONGSHU_SESSION_B64: ${{ secrets.XIAOHONGSHU_SESSION_B64 }}
          BOSS_SESSION_B64: ${{ secrets.BOSS_SESSION_B64 }}
        run: |
          set +e
          { echo "### Stored login sessions"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$INSTAGRAM_SESSION_B64$X_SESSION_B64$TIKTOK_SESSION_B64$REDDIT_SESSION_B64$FACEBOOK_SESSION_B64$LINKEDIN_SESSION_B64$XIAOHONGSHU_SESSION_B64$BOSS_SESSION_B64" ]; then
            python -m venv "$RUNNER_TEMP/scrapling-env"
            "$RUNNER_TEMP/scrapling-env/bin/pip" install -q -r requirements-scrapling.txt
            "$RUNNER_TEMP/scrapling-env/bin/python" -m patchright install --with-deps chromium
            export SCRAPLING_PYTHON="$RUNNER_TEMP/scrapling-env/bin/python"
            if [ -n "$X_SESSION_B64" ]; then                                      # the last resort for X only (twscrape, in its own environment; see requirements-twscrape.txt)
              python -m venv "$RUNNER_TEMP/twscrape-env"
              "$RUNNER_TEMP/twscrape-env/bin/pip" install -q -r requirements-twscrape.txt
              export TWSCRAPE_PYTHON="$RUNNER_TEMP/twscrape-env/bin/python"
            fi
            python -m contentintel observatory sessions --all --what check 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            code=${PIPESTATUS[0]}
          else
            python -m contentintel observatory sessions --all --what list 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            code=0
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Keep the pictures and page samples
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug
          path: debug
          if-no-files-found: ignore
          retention-days: 14

      - name: Show the health of every route
        if: inputs.plan != true
        shell: bash
        run: |
          { echo "### Collector health"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel health 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Update Google Sheets
        id: sheets
        if: inputs.plan != true
        continue-on-error: true
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_SHARE_EMAIL: ${{ secrets.SHEET_SHARE_EMAIL }}
          SHEET_FOLDER_ID: ${{ secrets.SHEET_FOLDER_ID }}
        run: |
          set +e
          { echo "### Google Sheets"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel sheets --all 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Save the results
        if: inputs.plan != true
        shell: bash
        run: |
          git config user.name "catalogue-acceptance"
          git config user.email "catalogue-acceptance@users.noreply.github.com"
          git add -f data
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Acceptance $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      - name: Show the run as red when a route failed
        if: steps.acceptance.outcome == 'failure' || steps.sheets.outcome == 'failure' || steps.sessions.outcome == 'failure'
        run: exit 1
