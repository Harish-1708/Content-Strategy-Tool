name: Video trial

# One clip per site, go/no-go each, on dummy accounts through the existing cookie-session method (contentintel/video_trial.py).
# DUMMY accounts only, never a main account. Cookies are captured by hand in an ordinary browser and pasted into the
# GitHub secrets named below; nothing here logs in, creates an account, solves a challenge or spends money. One clip
# per site per run, hard cap, enforced in code; output is a draft only — watermarked, personal-use, publishing OFF.
# A site that fails its trial is a verdict in the report (NO-GO, BLOCKED, NOT SET UP), not a failed run: the run only
# goes red when the trial itself broke. Luma is a stub until Harish signs in by hand and reports the trial-credit amount.
# A clip that is made goes ONLY to the brand the run is for (the `brand` input, required): to Shared Drive
# 'Idea Bank Automation' / Generated Content / VIDEO / <Brand name>, and one row is added to that brand's own
# Catalogue sheet, tab "Video Trials", with the Drive link. Nothing is ever saved to another brand's folder or sheet.

on:
  workflow_dispatch:
    inputs:
      site:
        description: "One site, or all of them (each is judged on its own either way)"
        type: choice
        options: [all, pixverse, google_flow, dreamina, kling, luma]
        default: all
      brand:
        description: "The brand this trial is for — the clip goes ONLY to that brand's Drive folder and sheet, never another brand's"
        type: choice
        options: [swoveralls, duderobe, defi_snacks]
        required: true
      prompt:
        description: "The prompt for the one clip (brand-neutral by default, so the trial tests the mechanism, not a brand)"
        default: "A red bicycle leaning against a wooden fence in a sunny garden, gentle breeze, steady camera"
        required: false
      dry_run:
        description: "Print the plan and the cookie checks only; never open a browser"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: video-trial
  cancel-in-progress: false

jobs:
  video-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt

      - name: Install the browser environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/video-env"
          "$RUNNER_TEMP/video-env/bin/pip" install -q -r requirements.txt -r requirements-browser.txt
          "$RUNNER_TEMP/video-env/bin/python" -m patchright install --with-deps chromium

      - name: Video trial
        id: run
        continue-on-error: true
        shell: bash
        env:
          PIXVERSE_COOKIES: ${{ secrets.PIXVERSE_COOKIES }}
          GOOGLE_FLOW_COOKIES: ${{ secrets.GOOGLE_FLOW_COOKIES }}
          DREAMINA_COOKIES: ${{ secrets.DREAMINA_COOKIES }}
          KLING_COOKIES: ${{ secrets.KLING_COOKIES }}
          LUMA_COOKIES: ${{ secrets.LUMA_COOKIES }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          IDEA_BANK_FOLDER_ID: ${{ secrets.IDEA_BANK_FOLDER_ID }}
          SHEET_FOLDER_ID: ${{ secrets.SHEET_FOLDER_ID }}
        run: |
          set +e
          args=(--site "${{ inputs.site }}" --brand "${{ inputs.brand }}" --prompt "${{ inputs.prompt }}" --out debug/video-trial --verdicts data/_shared/video_trial.json)
          if ${{ inputs.dry_run }}; then args+=(--dry-run); fi
          { echo "### Video trial"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/video-env/bin/python" -m contentintel.video_trial "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: "Save the verdicts and the trial log (never a secret value: the log holds secret names and counts only)"
        shell: bash
        run: |
          git config user.name "video-trial"
          git config user.email "video-trial@users.noreply.github.com"
          cp debug/video-trial/trial-log.jsonl data/_shared/video_trial_log.jsonl 2>/dev/null || echo "no trial log yet (nothing was recorded): nothing to save for it."
          for f in data/_shared/video_trial.json data/_shared/video_trial_log.jsonl; do
            if [ -f "$f" ]; then git add -f "$f"; else echo "$f does not exist yet: nothing to save for it."; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Video trial $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

      - name: Upload the clips (drafts only — watermarked, personal-use)
        uses: actions/upload-artifact@v4
        with:
          name: video-trial-clips
          path: debug/video-trial
          if-no-files-found: ignore
          retention-days: 30

      - name: Show the run as red when the trial itself broke
        if: steps.run.outcome == 'failure'
        run: exit 1
