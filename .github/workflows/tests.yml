# Runs the tests and the lint automatically on every push, so nothing needs to be run locally.
# The sabotage check (breaks the code on purpose to prove the tests notice) is optional:
# Actions > Tests > Run workflow > tick "sabotage".
name: Tests

on:
  push:
    paths-ignore:
      - "data/**"
  pull_request:
    paths-ignore:
      - "data/**"
  workflow_dispatch:
    inputs:
      sabotage:
        description: "Also run the sabotage check (several minutes)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: python -m pyflakes contentintel tests

      - name: Install the pinned Scrapling in its own environment (the worker tests run the real thing)
        run: |
          python -m venv "$RUNNER_TEMP/scrapling-env"
          "$RUNNER_TEMP/scrapling-env/bin/pip" install -q -r requirements-scrapling.txt
          echo "SCRAPLING_PYTHON=$RUNNER_TEMP/scrapling-env/bin/python" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the pinned gateway (so the two tests that need the real gateway run instead of being skipped)
        run: |
          commit=$(python -c "import json;print(json.load(open('ai/gateway.lock.json'))['gateway']['commit'])")
          mkdir "$RUNNER_TEMP/freellmapi" && cd "$RUNNER_TEMP/freellmapi"
          git init -q
          git remote add origin https://github.com/tashfeenahmed/freellmapi
          git fetch --depth 1 origin "$commit"
          git checkout --quiet FETCH_HEAD
          npm ci --workspace=shared --workspace=server --include-workspace-root --no-audit --no-fund
          npm run build -w server
          echo "FREEAPI_GATEWAY_DIR=$RUNNER_TEMP/freellmapi" >> "$GITHUB_ENV"

      - name: Tests
        run: python -m pytest -q

      - name: Sabotage check
        if: ${{ inputs.sabotage }}
        run: python tests/sabotage/run_sabotage.py

      - name: Sabotage check for the observatory, the AI additions and the sheet decisions
        if: ${{ inputs.sabotage }}
        run: python tests/sabotage/run_observatory_sabotage.py
