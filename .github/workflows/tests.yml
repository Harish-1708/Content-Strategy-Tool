# Runs the tests and the lint automatically on every push, so nothing needs to be run locally.
# The sabotage check (breaks the code on purpose to prove the tests notice) is optional:
# Actions > Tests > Run workflow > tick "sabotage".
name: Tests

on:
  push:
    paths-ignore:
      - "data/**"
  pull_request:
    paths-ignore:
      - "data/**"
  workflow_dispatch:
    inputs:
      sabotage:
        description: "Also run the UPDATED sabotage checks (everything written since Update 57), split into 3 parallel slices"
        type: boolean
        default: false
      sabotage_full:
        description: "Run EVERY sabotage check, split into 18 parallel slices (the first script has 1,884 checks and needs hours)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Install ffmpeg (measures how each video moves; the runner does not have it; the run FAILS if it cannot be installed)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break
            echo "ffmpeg install attempt $attempt failed"
            sleep 5
          done
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || { echo "ffmpeg or ffprobe is missing after 3 attempts: failing this run"; exit 1; }
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Lint
        run: python -m pyflakes contentintel tests

      - name: Install the pinned Scrapling in its own environment (the worker tests run the real thing)
        run: |
          python -m venv "$RUNNER_TEMP/scrapling-env"
          "$RUNNER_TEMP/scrapling-env/bin/pip" install -q -r requirements-scrapling.txt
          echo "SCRAPLING_PYTHON=$RUNNER_TEMP/scrapling-env/bin/python" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the pinned gateway (so the two tests that need the real gateway run instead of being skipped)
        run: |
          commit=$(python -c "import json;print(json.load(open('ai/gateway.lock.json'))['gateway']['commit'])")
          mkdir "$RUNNER_TEMP/freellmapi" && cd "$RUNNER_TEMP/freellmapi"
          git init -q
          git remote add origin https://github.com/tashfeenahmed/freellmapi
          git fetch --depth 1 origin "$commit"
          git checkout --quiet FETCH_HEAD
          npm ci --workspace=shared --workspace=server --include-workspace-root --no-audit --no-fund
          npm run build -w server
          echo "FREEAPI_GATEWAY_DIR=$RUNNER_TEMP/freellmapi" >> "$GITHUB_ENV"

      - name: Tests
        run: python -m pytest -q -rs          # -rs: every skipped test is listed with its reason in the log

  # The sabotage checks break the code on purpose to prove the tests notice. They are split so that no job comes near GitHub's six-hour limit.
  # (One job running both scripts one after the other could not finish: the first script alone has 1,884 checks, so the second script, which holds
  # every check written since Update 57, never ran.)
  #   sabotage       the UPDATED checks only (Update 57 on): the second script, in 3 slices
  #   sabotage_full  EVERY check: the first script in 12 slices and the second script in 6 slices

  sabotage-updated:
    if: ${{ inputs.sabotage && !inputs.sabotage_full }}          # the full run already contains the updated checks: not twice
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        chunk: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Install ffmpeg (the pace checks need it; the run FAILS if it cannot be installed)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break
            echo "ffmpeg install attempt $attempt failed"
            sleep 5
          done
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || { echo "ffmpeg or ffprobe is missing after 3 attempts: failing this run"; exit 1; }
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Sabotage check, the updated checks (slice ${{ matrix.chunk }})
        env:
          SABOTAGE_SET: updated
          SABOTAGE_CHUNK: ${{ matrix.chunk }}
          SABOTAGE_WORKERS: "4"
        run: python tests/sabotage/run_observatory_sabotage.py

  sabotage-full-observatory:
    if: ${{ inputs.sabotage_full }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        chunk: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Install ffmpeg (the pace checks need it; the run FAILS if it cannot be installed)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break
            echo "ffmpeg install attempt $attempt failed"
            sleep 5
          done
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || { echo "ffmpeg or ffprobe is missing after 3 attempts: failing this run"; exit 1; }
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Sabotage check, the observatory, AI and sheet checks (slice ${{ matrix.chunk }})
        env:
          SABOTAGE_CHUNK: ${{ matrix.chunk }}
          SABOTAGE_WORKERS: "4"
        run: python tests/sabotage/run_observatory_sabotage.py

  sabotage-full-main:
    if: ${{ inputs.sabotage_full }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        chunk: ["1/12", "2/12", "3/12", "4/12", "5/12", "6/12", "7/12", "8/12", "9/12", "10/12", "11/12", "12/12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Install ffmpeg (the pace checks need it; the run FAILS if it cannot be installed)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break
            echo "ffmpeg install attempt $attempt failed"
            sleep 5
          done
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || { echo "ffmpeg or ffprobe is missing after 3 attempts: failing this run"; exit 1; }
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Sabotage check, the main checks (slice ${{ matrix.chunk }})
        env:
          SABOTAGE_CHUNK: ${{ matrix.chunk }}
          SABOTAGE_WORKERS: "4"
        run: python tests/sabotage/run_sabotage.py
