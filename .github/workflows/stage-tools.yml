name: Stage tools

# Stage 5 (transcription and its probe) and stage 10 (the browser bake-off). No model is called here: transcription uses Groq's hosted Whisper (GROQ_API_KEY) with Faster-Whisper on the runner as the backup,
# and the bake-off reads PUBLIC pages only (no login, no stealth, no puzzle solving). Run it from Actions > Stage tools > Run workflow.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        options: [probe-transcribe, transcribe, bakeoff]
        default: probe-transcribe
      brand:
        description: "transcribe: the brand folder name"
        required: false
        default: ""
      url:
        description: "transcribe: a public https address of an audio or video file (read once, up to 24 MB)"
        required: false
        default: ""
      source:
        description: "transcribe: where the audio came from (kept with the transcript)"
        required: false
        default: ""
      language:
        description: "transcribe: the spoken language code (empty = detect)"
        required: false
        default: ""
      bakeoff_urls:
        description: "bakeoff: public addresses, comma-separated (empty = the list in bakeoff.yaml)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Install Lightpanda (bake-off engine)
        if: inputs.action == 'bakeoff'
        continue-on-error: true
        run: |
          mkdir -p "$HOME/bin"
          curl -fL -o "$HOME/bin/lightpanda" https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux
          chmod a+x "$HOME/bin/lightpanda"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          LIGHTPANDA_DISABLE_TELEMETRY=true "$HOME/bin/lightpanda" version

      - name: Install Obscura (bake-off engine)
        if: inputs.action == 'bakeoff'
        continue-on-error: true
        run: |
          mkdir -p "$HOME/bin"
          curl -fL -o /tmp/obscura.tar.gz https://github.com/h4ckf0r0day/obscura/releases/latest/download/obscura-x86_64-linux.tar.gz
          tar xzf /tmp/obscura.tar.gz -C "$HOME/bin"          # the archive holds obscura and obscura-worker: they stay in one folder
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/obscura" --help | head -5

      - name: Install agent-browser (bake-off engine, public pages only)
        if: inputs.action == 'bakeoff'
        continue-on-error: true
        run: |
          npm install -g agent-browser
          agent-browser install --with-deps

      - name: Cache VibeASR (the CPU build of VibeVoice-ASR and its model)
        if: inputs.action != 'bakeoff' && vars.VIBEASR_COMMAND == ''
        uses: actions/cache@v5
        with:
          path: ~/VibeASR.cpp
          key: vibeasr-v1

      - name: Install VibeVoice-ASR (microsoft/VibeASR.cpp, MIT licence, CPU only)
        if: inputs.action != 'bakeoff' && vars.VIBEASR_COMMAND == ''
        continue-on-error: true
        run: |
          if [ ! -x "$HOME/VibeASR.cpp/build/bin/asr_infer" ]; then
            git clone --depth 1 --recursive https://github.com/microsoft/VibeASR.cpp.git "$HOME/VibeASR.cpp"
            cd "$HOME/VibeASR.cpp"
            cmake -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"$(nproc)"
            pip install huggingface_hub
            huggingface-cli download microsoft/VibeVoice-ASR-BitNet --local-dir models/vibeasr
          fi
          echo "VIBEASR_COMMAND=$HOME/VibeASR.cpp/build/bin/asr_infer --vae-model $HOME/VibeASR.cpp/models/vibeasr/vibeasr-vae-encoder-i8_s.gguf --lm-model $HOME/VibeASR.cpp/models/vibeasr/vibeasr-lm-i2_s-embed-q6_k.gguf --audio {audio} -t 4 --greedy" >> "$GITHUB_ENV"

      - name: Install the local transcription backup (Faster-Whisper)
        if: inputs.action != 'bakeoff'
        continue-on-error: true
        run: pip install "faster-whisper==1.1.1" "av==13.1.0"          # a pinned, compatible pair: the unpinned install broke with "unexpected keyword argument metadata_errors"

      - name: Run it
        env:
          ACTION: ${{ inputs.action }}
          BRAND: ${{ inputs.brand }}
          URL: ${{ inputs.url }}
          SOURCE: ${{ inputs.source }}
          LANGUAGE: ${{ inputs.language }}
          BAKEOFF_URLS: ${{ inputs.bakeoff_urls }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VIBEASR_COMMAND: ${{ vars.VIBEASR_COMMAND || env.VIBEASR_COMMAND }}          # the repository variable if set, else the one the install step above made
          LIGHTPANDA_DISABLE_TELEMETRY: "true"
        run: |
          set -o pipefail
          case "$ACTION" in
            probe-transcribe) python -m contentintel stage --action probe-transcribe ;;
            transcribe) python -m contentintel stage --action transcribe --brand "$BRAND" --url "$URL" --source "$SOURCE" --language "$LANGUAGE" ;;
            bakeoff) python -m contentintel stage --action bakeoff --bakeoff-urls "$BAKEOFF_URLS" ;;
          esac

      - name: Save the data
        if: always() && (inputs.action == 'probe-transcribe' || inputs.action == 'transcribe')
        run: |
          git config user.name "stage-tools"
          git config user.email "stage-tools@users.noreply.github.com"
          git add -f data/_shared/transcribe_rankings.json data/*/extras/transcripts.json data/*/catalogue/transcripts.md 2>/dev/null || true          # only the files this tool writes
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Stage tools $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "--- files this run left changed but did not save (set aside for the pull, then put back):"
            git status --porcelain | head -40
            git pull --rebase --autostash
            git push
          fi
