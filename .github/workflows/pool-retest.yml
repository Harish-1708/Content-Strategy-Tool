name: Pool retest

# Measures every provider on each job's REAL prompts (the refresh's extraction, review and conflict check, and the foundation chain) and writes the measured order of each job's ranked list to
# data/_shared/ai_rankings.json, which every later run uses. Public synthetic inputs only: nothing about a client is sent. Providers from FreeLLMAPI and OmniRoute are measured together.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which jobs: all, or comma-separated (foundation_json, story_extract_json, story_review_json, conflict_check_json)"
        required: false
        default: "all"
      runs:
        description: "Runs of each probe per provider (more runs = a steadier order, more calls)"
        required: false
        default: "2"
      only:
        description: "Only these providers, comma-separated (blank = every provider that can serve the job)"
        required: false
        default: ""
      apply:
        description: "Write the measured order so later runs use it"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FREEAPI_ENCRYPTION_KEY: ${{ secrets.FREEAPI_ENCRYPTION_KEY }}
      FREEAPI_ADMIN_PASSWORD: ${{ secrets.FREEAPI_ADMIN_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      API_AIRFORCE_API_KEY: ${{ secrets.API_AIRFORCE_API_KEY }}
      BLUESMINDS_API_KEY: ${{ secrets.BLUESMINDS_API_KEY }}
      BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Set up the free provider pool
        uses: ./.github/actions/ai-pool

      - name: Measure each job's providers
        shell: bash
        env:
          JOBS: ${{ inputs.jobs }}
          RUNS: ${{ inputs.runs }}
          ONLY: ${{ inputs.only }}
          APPLY: ${{ inputs.apply }}
        run: |
          set +e
          args=(--live --jobs "${JOBS:-all}" --runs "${RUNS:-2}")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          { echo "### Pool retest"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel ai rank "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Save the measured order
        if: always() && inputs.apply
        shell: bash
        run: |
          git config user.name "pool-retest"
          git config user.email "pool-retest@users.noreply.github.com"
          git add -f data/_shared/ai_rankings.json data/_shared/ai_usage.json 2>/dev/null || true          # only what the retest writes
          if git diff --cached --quiet; then
            echo "No ranking changes to save."
          else
            git commit -m "Pool retest: measured order of each job's providers"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
