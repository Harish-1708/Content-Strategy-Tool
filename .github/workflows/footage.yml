name: Footage

# The footage inventory for cuts briefs, built from the brand's footage folder: nothing is listed by hand.
# WHERE THE FOOTAGE GOES: in the Google Drive folder the Idea Bank already uses (the IDEA_BANK_FOLDER_ID secret), inside the brand's own folder, in a folder called Footage:
#     <Idea Bank folder> / <Brand name> / Footage /      (subfolders are fine: their names become tags)
# The tool creates that Footage folder itself the first time it looks. Nothing is downloaded: it reads each clip's length and shape from Drive.
# Runs by itself every Monday; start it by hand after you drop new clips in.
on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:
    inputs:
      brand:
        description: "a brand slug, or all"
        required: false
        default: "all"
      action:
        description: "scan (list the folder and save the inventory) or status"
        required: false
        type: choice
        default: scan
        options: [scan, status]

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  footage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Run it
        env:
          BRAND: ${{ inputs.brand }}
          ACTION: ${{ inputs.action }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          IDEA_BANK_FOLDER_ID: ${{ secrets.IDEA_BANK_FOLDER_ID }}
        run: |
          set -o pipefail
          { echo "### Footage"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          code=0
          python -m contentintel footage --action "${ACTION:-scan}" --brand "${BRAND:-all}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || code=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Save the data
        if: always()
        run: |
          git config user.name "footage"
          git config user.email "footage@users.noreply.github.com"
          add_each() { for f in "$@"; do if [ -e "$f" ]; then git add -f "$f"; else echo "not written by this run (skipped): $f"; fi; done; }          # one path at a time: a single add of several is refused whole when one is missing
          add_each data/*/extras/footage.json
          if git diff --cached --quiet; then
            echo "NOTHING TO SAVE: no footage.json was written or changed by this run"
          else
            git commit -m "Footage $(date -u +%Y-%m-%dT%H:%MZ)"
            bash .github/scripts/push-with-retry.sh
          fi

      - name: Keep the unsaved data (only when the save failed)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unsaved-data
          path: unsaved-data/
          if-no-files-found: ignore
          retention-days: 14
