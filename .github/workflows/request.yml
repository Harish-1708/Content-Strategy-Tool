# Advanced mode: type an idea, let Claude plan which tools to use, confirm or change the plan, then run it.
#
#   1. Run with ACTION = plan. Write what you want in your own words ("Father's Day gifting ideas"), choose the tools yourself
#      (tools = manual, then tick them) or let Claude choose (tools = auto), and set the region (blank is worldwide).
#      Claude proposes a plan: the ad searches, hashtags, web searches (Serper.dev, Tavily and SerpApi as an extra beside the
#      collectors), Deep Research questions and the creator and influencer angles, with what it will use. NOTHING is searched yet.
#      The plan is saved as a request (RQ-0001, RQ-0002, ...) and shown in the brand sheet's Requests tab.
#   2. Run with ACTION = run and the request id. To change the plan first, write the changes in the changes box and Claude
#      revises it before anything runs. The run collects, searches and puts what it finds in the Idea Bank.
#   3. Review the Idea Bank tab, mark the rows you want as Use, then run the Brief workflow.
name: Request

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand folder name (for example swoveralls)"
        required: true
      action:
        description: "plan: make a plan (nothing is searched). run: run a planned request."
        type: choice
        options: [plan, run]
        default: plan
      idea:
        description: "For plan: what you want, in your own words"
        required: false
        default: ""
      request_id:
        description: "For run: the request id from the plan, for example RQ-0001"
        required: false
        default: ""
      changes:
        description: "For run: what to change in the plan before it runs (blank runs it as planned)"
        required: false
        default: ""
      tools:
        description: "plan: auto lets Claude choose the tools; manual uses only the ones ticked below"
        type: choice
        options: [auto, manual]
        default: auto
      use_meta_ads:
        description: "Manual: Meta Ad Library ads"
        type: boolean
        default: true
      use_instagram:
        description: "Manual: Instagram posts"
        type: boolean
        default: true
      use_tiktok:
        description: "Manual: TikTok posts"
        type: boolean
        default: true
      use_web_search:
        description: "Manual: web search (Serper.dev, Tavily, SerpApi)"
        type: boolean
        default: true
      use_deep_research:
        description: "Manual: Gemini Deep Research (slow, and uses your monthly reports)"
        type: boolean
        default: false
      apify_extra:
        description: "Run Apify beside the browser for this request (uses Apify credit)"
        type: boolean
        default: false
      region:
        description: "Where to look: blank is worldwide, or a two-letter country code such as us"
        required: false
        default: ""
      formats:
        description: "Kinds of content to find, comma separated: ugc, ai, influencer, static, carousel, video, meme (posts, reels, creators and AI content are understood). Blank is any"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt

      - run: pip install -r requirements.txt

      - name: Remember the downloaded browser
        if: inputs.action == 'run'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-browser.txt') }}

      - name: Install the browser
        if: inputs.action == 'run'
        shell: bash
        run: |
          pip install -r requirements-browser.txt
          for attempt in 1 2 3; do
            if playwright install --with-deps chromium; then exit 0; fi
            echo "The browser download failed (try $attempt of 3); trying again in 20 seconds"
            sleep 20
          done
          echo "::error::The browser could not be downloaded after 3 tries. Run the workflow again."
          exit 1

      - name: Plan or run the request
        id: request
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          ACTION: ${{ inputs.action }}
          IDEA: ${{ inputs.idea }}
          REQUEST_ID: ${{ inputs.request_id }}
          CHANGES: ${{ inputs.changes }}
          TOOLS: ${{ inputs.tools }}
          USE_META_ADS: ${{ inputs.use_meta_ads }}
          USE_INSTAGRAM: ${{ inputs.use_instagram }}
          USE_TIKTOK: ${{ inputs.use_tiktok }}
          USE_WEB_SEARCH: ${{ inputs.use_web_search }}
          USE_DEEP_RESEARCH: ${{ inputs.use_deep_research }}
          APIFY_EXTRA: ${{ inputs.apify_extra }}
          REGION: ${{ inputs.region }}
          FORMATS: ${{ inputs.formats }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          TIKTOK_PASSWORD: ${{ secrets.TIKTOK_PASSWORD }}
          GEMINI_COOKIES: ${{ secrets.GEMINI_COOKIES }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_MCP: "on"
          AGENT_REACH_SEARCH: "on"
          AGENT_REACH_URL: ${{ secrets.AGENT_REACH_URL }}
          AGENT_REACH_TOKEN: ${{ secrets.AGENT_REACH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          IDEA_BANK_FOLDER_ID: ${{ secrets.IDEA_BANK_FOLDER_ID }}
        run: |
          set +e
          if [ "$ACTION" = "plan" ]; then
            allow=""
            if [ "$USE_META_ADS" = "true" ]; then allow="$allow,meta_ads"; fi
            if [ "$USE_INSTAGRAM" = "true" ]; then allow="$allow,instagram"; fi
            if [ "$USE_TIKTOK" = "true" ]; then allow="$allow,tiktok"; fi
            if [ "$USE_WEB_SEARCH" = "true" ]; then allow="$allow,web_search"; fi
            if [ "$USE_DEEP_RESEARCH" = "true" ]; then allow="$allow,deep_research"; fi
            args=(plan --brand "$BRAND" --text "$IDEA" --tools "$TOOLS" --allow "${allow#,}")
            if [ -n "$REGION" ]; then args+=(--region "$REGION"); fi
            if [ "$APIFY_EXTRA" = "true" ]; then args+=(--apify-extra); fi
            if [ -n "$FORMATS" ]; then args+=(--formats "$FORMATS"); fi
          else
            args=(run --brand "$BRAND" --request "$REQUEST_ID")
            if [ -n "$CHANGES" ]; then args+=(--changes "$CHANGES"); fi
          fi
          { echo "### Request ($ACTION)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel request "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Keep the pictures and page samples
        if: always() && inputs.action == 'run'
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug
          if-no-files-found: ignore
          retention-days: 14

      - name: Update Google Sheets
        id: sheets
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_SHARE_EMAIL: ${{ secrets.SHEET_SHARE_EMAIL }}
          SHEET_FOLDER_ID: ${{ secrets.SHEET_FOLDER_ID }}
        run: |
          set +e
          { echo "### Google Sheets"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel sheets --brand "$BRAND" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Add Deep Research reports to the Google Doc
        id: docs
        if: inputs.action == 'run'
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DEEP_RESEARCH_DOC_ID: ${{ secrets.DEEP_RESEARCH_DOC_ID }}
        run: |
          set +e
          { echo "### Google Doc (Deep Research reports)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel docs --brand "$BRAND" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Save the data
        shell: bash
        run: |
          git config user.name "catalogue-request"
          git config user.email "catalogue-request@users.noreply.github.com"
          git add -f data
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Request $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      - name: Show the run as red when attention is needed
        if: steps.request.outcome == 'failure' || steps.sheets.outcome == 'failure' || steps.docs.outcome == 'failure'
        run: exit 1
