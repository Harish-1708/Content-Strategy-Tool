name: Batch 3 tools

# Forecasting (TimesFM 3.0: forecast, anomalies, momentum, Idea Bank timeliness), the CLIP stock corpus, and the MoneyPrinterTurbo status.
# MoneyPrinterTurbo itself needs a running host and is OFF (mpt.yaml); only its status is shown here. Nothing here calls a paid service and nothing is published.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "forecast, stock-index, stock-search or mpt-status"
        required: true
        type: choice
        options: [forecast, stock-index, stock-search, mpt-status]
      brand:
        description: "a brand slug, or all"
        required: false
        default: "all"
      query:
        description: "stock-search: the script line or idea to find a picture for"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  batch3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Install TimesFM (CPU)
        if: inputs.action == 'forecast'
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "timesfm[torch]>=3.0"          # TimesFM 3.0 (module timesfm3), weights google/timesfm-3.0-pytorch; 3.0 or newer, so an older release can never be picked
          pip show timesfm | head -3          # the installed version is in the log
          python -c "import timesfm3; print('timesfm3 module found at', timesfm3.__file__)"

      - name: Install the CLIP model (CPU)
        if: startsWith(inputs.action, 'stock')
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers pillow

      - name: Run it
        env:
          ACTION: ${{ inputs.action }}
          BRAND: ${{ inputs.brand }}
          QUERY: ${{ inputs.query }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}          # mpt-status reports whether it is configured and makes ONE real test search (name only, never the value)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -o pipefail
          python -m contentintel batch3 --action "$ACTION" --brand "${BRAND:-all}" --query "$QUERY"

      - name: Save the data
        if: always()          # no condition on the action: the step decides from what the run wrote (the earlier condition left it skipped, 0 s and no output, after a stock-index that had indexed pictures)
        run: |
          git config user.name "batch3-tools"
          git config user.email "batch3-tools@users.noreply.github.com"
          echo "save step: action=${{ inputs.action }}"
          echo "--- files this run wrote (forecasts, stock corpora, stock matches):"
          ls -la data/*/extras/forecasts.json data/*/extras/stock_corpus.json data/*/extras/stock_matches.json 2>&1 | head -20
          add_each() { for f in "$@"; do if [ -e "$f" ]; then git add -f "$f"; else echo "not written by this run (skipped): $f"; fi; done; }          # ONE `git add` of several paths is refused WHOLE when any one is missing, and `2>/dev/null || true` hid it: nothing was ever saved
          add_each data/*/extras/forecasts.json data/*/extras/stock_corpus.json data/*/extras/stock_matches.json
          echo "--- staged for the commit:"
          git diff --cached --stat | tail -5
          if git diff --cached --quiet; then
            echo "NOTHING TO SAVE: no forecasts.json, stock_corpus.json or stock_matches.json was written or changed by this run"
          else
            git commit -m "Batch 3 tools $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "--- files this run left changed but did not save (set aside for the pull, then put back):"
            git status --porcelain | head -40
            bash .github/scripts/push-with-retry.sh
          fi

      - name: Keep the unsaved data (only when the save failed)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unsaved-data
          path: unsaved-data/
          if-no-files-found: ignore
          retention-days: 14
