name: Concat gate

# CONCAT IS DROPPED (decision of 2026-11-24, recorded in concat.yaml). Concat Gate #2 (run 45328841214) showed that Concat is a desktop GUI editor, not a headless CLI: every help command tried to open a window and none of
# six guessed render commands produced a video. A host for it would need a desktop session, a display and GUI automation of a program whose scripting interface was never found, and nothing in the plan depends on it.
# This workflow therefore installs and runs nothing: it only says so. It may be deleted (Actions > Concat gate > delete workflow file).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Concat is dropped
        run: |
          echo "Concat is DROPPED: a desktop GUI editor with no headless render command. Nothing was installed or run. See concat.yaml. Delete this workflow file when you like."
          { echo "### Concat gate"; echo "Concat is DROPPED (2026-11-24): a desktop GUI editor with no headless render command; no host plan. See concat.yaml."; } >> "$GITHUB_STEP_SUMMARY"
