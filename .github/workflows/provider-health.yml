name: Provider health

# The daily provider-model health run (ai_health.yaml, contentintel/ai/provider_health.py). Pinned model ids keep dying (AnyAPI qwen3.8, xKiro qwen3.6-plus, llm7, navy, nvidia timeouts): nobody can hand-edit the code
# every time, so every day at 05:30 UTC this probes every enabled provider's models with ONE tiny call, discovers the live free models of providers that publish a list, scores them per job with the seven weights the router
# uses, applies the guards (free only, probe-passed only, the cost guard, the capability guard, never the LAST working model of a job, at most max_swaps routes changed) and COMMITS the new ranked lists directly, with no
# human gate. It touches ONLY data/_shared/provider_health.json and data/_shared/ai_rankings.json: no code, no other data file, no workflow, no setting. The owner's switch is `auto_update` in ai_health.yaml (default ON;
# off = the run only reports). The router uses the generated lists while they are fresh and falls back to the static lists and the last retest otherwise; one `git revert` of a commit undoes it.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FREEAPI_ENCRYPTION_KEY: ${{ secrets.FREEAPI_ENCRYPTION_KEY }}
      FREEAPI_ADMIN_PASSWORD: ${{ secrets.FREEAPI_ADMIN_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
      ANYAPI_API_KEY: ${{ secrets.ANYAPI_API_KEY }}
      NAVY_API_KEY: ${{ secrets.NAVY_API_KEY }}
      API_AIRFORCE_API_KEY: ${{ secrets.API_AIRFORCE_API_KEY }}
      BLUESMINDS_API_KEY: ${{ secrets.BLUESMINDS_API_KEY }}
      BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}          # ONLY for the judge: one small call, at most once a day, and only when the rules cannot decide; the probes never use it
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Set up the free provider pool
        uses: ./.github/actions/ai-pool

      - name: Probe, score and decide
        shell: bash
        run: |
          set +e
          { echo "### Provider health"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -u -m contentintel ai health --live --message-file "$RUNNER_TEMP/health_message.txt" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Save the generated lists (these two files and nothing else)
        if: always()
        shell: bash
        run: |
          git config user.name "provider-health"
          git config user.email "provider-health@users.noreply.github.com"
          add_each() { for f in "$@"; do if [ -e "$f" ]; then git add -f "$f"; else echo "not written by this run (skipped): $f"; fi; done; }          # one path at a time: a single `git add` of several is refused whole when one is missing
          add_each data/_shared/provider_health.json data/_shared/ai_rankings.json
          if git diff --cached --quiet; then
            echo "No list changes to save."
          else
            git commit -m "$(cat "$RUNNER_TEMP/health_message.txt" 2>/dev/null || echo "Provider health $(date -u +%Y-%m-%d)")"
            bash .github/scripts/push-with-retry.sh
          fi

      - name: Keep the unsaved data (only when the save failed)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unsaved-data
          path: unsaved-data/
          if-no-files-found: ignore
          retention-days: 14
