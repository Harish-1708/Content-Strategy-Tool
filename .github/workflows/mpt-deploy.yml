name: MoneyPrinterTurbo deploy (Cloud Run)

# MoneyPrinterTurbo is a web application: it needs a running host. This deploys it to Cloud Run. It is OFF: it does nothing until the owner types `yes` in `host_ready` AND the Google Cloud secrets exist. Publishing stays off in the tool
# either way. Pexels (free, no card) supplies the stock footage: its key goes into MPT's own config on the host.
on:
  workflow_dispatch:
    inputs:
      host_ready:
        description: "type yes only when the owner has said a host is ready"
        required: true
        default: "no"

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.host_ready == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: harry0703/MoneyPrinterTurbo
          path: mpt
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SERVICE_ACCOUNT_JSON }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: moneyprinterturbo
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          source: mpt
          env_vars: PIXABAY_API_KEY=${{ env.PIXABAY_API_KEY }}
          flags: --no-allow-unauthenticated --memory=4Gi --cpu=2 --timeout=900          # private: only a caller with a Google identity token (MPT_TOKEN) can use it
