# Batch 2: the Aaron marketing skills, connected EXTERNALLY, and the two registries (the narrative canon and the offer-claims ledger).
#   status         the skills, how many are ready, waiting for the stores' own numbers (NEEDS_INPUT) or never auto-run; whether the checkout is the pinned commit
#   verify         the same checks, and the run FAILS if the connection cannot be trusted (not the pinned commit, a skill or a runtime file missing)
#   update-report  what changed upstream since the pinned commit; nothing is adopted until external_skills.yaml's pinned_commit is changed by hand
#   catalogue      writes data/_shared/skills_catalogue.json (each skill's hash; git keeps the history)
#   seed-claims    loads each brand's claims seed (the story-bank gaps) into its ledger as blocked / unverified / conflicted, never verified
#   claims-status  counts per brand
#   gate           checks the text in 'text' against the brand's claims ledger (OK / NEEDS_REVIEW / BLOCKED); the run FAILS on BLOCKED
#   refresh-story-bank  public-source research per brand (also monthly, on the 2nd): new facts enter ONLY as UNVERIFIED claims with their source and quotation; a disagreement keeps BOTH as a conflict for the owner; nothing is deleted, verified or made canon
#   foundation     the per-brand foundation chain: proposes canon sections (never approved by the tool); at most max_steps steps and max_calls model calls per run; a failed call is asked once more and its error is printed in full
#   reclassify-conflicts  re-checks the conflicts the refresh created: a pair that is not really a disagreement goes back to UNVERIFIED (nothing deleted, the old claim untouched, the owner's decisions never overridden)
# The skills repository is checked out at the pinned commit, with its scripts and references. Its text is read as data; none of its scripts is run by this workflow.
# To run it: Actions > Skills and registries > Run workflow. Nothing here posts or changes anything on any platform.
name: Skills and registries

on:
  schedule:
    - cron: "17 5 2 * *"          # monthly, on the 2nd: the story-bank refresh (it only ever ADDS unverified facts and conflicts)
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        options: [status, verify, update-report, catalogue, seed-claims, claims-status, gate, refresh-story-bank, foundation, reclassify-conflicts]
        default: status
      brand:
        description: "Brand folder name (for example swoveralls) or all"
        required: false
        default: "all"
      text:
        description: "gate: the text to check against the claims ledger"
        required: false
        default: ""
      steps:
        description: "foundation: only these sections, comma-separated (empty = the whole chain)"
        required: false
        default: ""
      max_steps:
        description: "foundation: at most this many steps in one run (the next run continues)"
        required: false
        default: "3"
      max_calls:
        description: "foundation and reclassify-conflicts: at most this many model calls in one run (a retry or a correction counts; 0 = no limit)"
        required: false
        default: "6"

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FREEAPI_ENCRYPTION_KEY: ${{ secrets.FREEAPI_ENCRYPTION_KEY }}
      FREEAPI_ADMIN_PASSWORD: ${{ secrets.FREEAPI_ADMIN_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      API_AIRFORCE_API_KEY: ${{ secrets.API_AIRFORCE_API_KEY }}
      BLUESMINDS_API_KEY: ${{ secrets.BLUESMINDS_API_KEY }}
      BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Set up the free provider pool
        if: inputs.action == 'refresh-story-bank' || inputs.action == 'foundation' || inputs.action == 'reclassify-conflicts' || github.event_name == 'schedule'
        uses: ./.github/actions/ai-pool


      - name: Check out the skills repository at the pinned commit
        if: inputs.action == 'status' || inputs.action == 'verify' || inputs.action == 'update-report' || inputs.action == 'catalogue' || inputs.action == 'foundation'
        shell: bash
        run: |
          url=$(python -c "import yaml; print(yaml.safe_load(open('external_skills.yaml'))['repo']['url'])")
          sha=$(python -c "import yaml; print(yaml.safe_load(open('external_skills.yaml'))['repo']['pinned_commit'])")
          path=$(python -c "import yaml; print(yaml.safe_load(open('external_skills.yaml'))['repo']['checkout_path'])")
          case "$sha" in *[!0-9a-f]*|"") echo "::error::pinned_commit in external_skills.yaml is not a 40-character commit hash"; exit 1 ;; esac
          [ "${#sha}" -eq 40 ] || { echo "::error::pinned_commit in external_skills.yaml is not a 40-character commit hash"; exit 1; }
          mkdir -p "$(dirname "$path")"
          # a partial clone keeps the history (the update report needs it) without downloading every file twice
          git clone --quiet --filter=blob:none --no-checkout "$url" "$path"
          git -C "$path" checkout --quiet "$sha"
          [ "$(git -C "$path" rev-parse HEAD)" = "$sha" ] || { echo "::error::the checkout is not at the pinned commit"; exit 1; }
          echo "Skills repository at $(git -C "$path" rev-parse HEAD)"

      - name: Run it
        shell: bash
        env:
          ACTION: ${{ inputs.action || 'refresh-story-bank' }}
          BRAND: ${{ inputs.brand || 'all' }}
          TEXT: ${{ inputs.text }}
          STEPS: ${{ inputs.steps }}
          MAX_STEPS: ${{ inputs.max_steps || '3' }}
          MAX_CALLS: ${{ inputs.max_calls || '6' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          set -o pipefail
          brand_args=()
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then brand_args=(--brand "$BRAND"); fi
          case "$ACTION" in
            status|verify|update-report|catalogue) python -m contentintel skills --action "$ACTION" ;;
            seed-claims) python -m contentintel canon --action seed "${brand_args[@]}" ;;
            claims-status) python -m contentintel canon --action status "${brand_args[@]}" ;;
            gate) python -m contentintel canon --action gate --text "$TEXT" "${brand_args[@]}" ;;
            refresh-story-bank) python -m contentintel canon --action refresh "${brand_args[@]}" ;;
            foundation) python -m contentintel canon --action foundation --steps "$STEPS" --max-steps "$MAX_STEPS" --max-calls "$MAX_CALLS" "${brand_args[@]}" ;;
            reclassify-conflicts) python -m contentintel canon --action reclassify-conflicts --max-calls "$MAX_CALLS" "${brand_args[@]}" ;;
          esac

      - name: Save the data
        if: always() && (inputs.action == 'catalogue' || inputs.action == 'seed-claims' || inputs.action == 'foundation' || inputs.action == 'refresh-story-bank' || inputs.action == 'reclassify-conflicts' || github.event_name == 'schedule')
        shell: bash
        run: |
          git config user.name "skills"
          git config user.email "skills@users.noreply.github.com"
          git add -f data/_shared/skills_catalogue.json 2>/dev/null || true          # only the files this tool writes, not the whole data tree
          for d in data/*/registry; do
            if [ -d "$d" ]; then git add -f "$d"; fi
          done
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Skills and registries $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
