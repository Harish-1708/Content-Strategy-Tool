# Searches the web for each brand using your search providers, within the credit caps in
# research.yaml, then adds what it found to each brand's Google Sheet (Research tab).
# Runs every Monday by itself. To run it now: Actions > Research > Run workflow.
# "Dry run" (ticked by default when you run it by hand) shows the plan and which provider
# would take each search, and spends nothing. "Provider check" instead proves each ticked
# service works with a real web search and a real news search (a few credits in total).
name: Research

on:
  schedule:
    - cron: "11 7 * * 1"          # Mondays 07:11 UTC
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand folder name (for example swoveralls) or all"
        required: true
        default: "all"
      use_serper_dev:
        description: "Use Serper.dev"
        type: boolean
        default: true
      use_tavily:
        description: "Use Tavily"
        type: boolean
        default: true
      use_serpapi:
        description: "Use SerpApi"
        type: boolean
        default: true
      region:
        description: "Where to search: worldwide, or a two-letter country code such as us (blank uses research.yaml, which says worldwide)"
        required: false
        default: ""
      max_queries:
        description: "Most searches to run now (blank uses the limit in research.yaml)"
        required: false
        default: ""
      compare:
        description: "Run each of the first few searches on EVERY ticked service and compare their results"
        type: boolean
        default: true
      compare_queries:
        description: "How many searches may be compared (blank uses research.yaml; each costs one credit per service)"
        required: false
        default: ""
      provider_check:
        description: "Prove each ticked service works: one web and one news search each, a few credits. Ignores Dry run"
        type: boolean
        default: false
      read_pages:
        description: "After the search, read the pages behind this many of the new results through the platform's page readers (0 = do not). Needs the OBSERVATORY_CONTACT secret; which reader is used is the owner's choice in the Controls tab"
        required: false
        default: "0"
      dry_run:
        description: "Show the plan and spend nothing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Research
        id: research
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          USE_SERPER_DEV: ${{ inputs.use_serper_dev }}
          USE_TAVILY: ${{ inputs.use_tavily }}
          USE_SERPAPI: ${{ inputs.use_serpapi }}
          MAX_QUERIES: ${{ inputs.max_queries }}
          REGION: ${{ inputs.region }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROVIDER_CHECK: ${{ inputs.provider_check }}
          COMPARE: ${{ inputs.compare }}
          COMPARE_QUERIES: ${{ inputs.compare_queries }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_MCP: "on"
          AGENT_REACH_SEARCH: "on"
        run: |
          set +e
          args=(--all)
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args=(--brand "$BRAND"); fi
          providers=""
          if [ "$USE_SERPER_DEV" != "false" ]; then providers="$providers,serper_dev"; fi
          if [ "$USE_TAVILY" != "false" ]; then providers="$providers,tavily"; fi
          if [ "$USE_SERPAPI" != "false" ]; then providers="$providers,serpapi"; fi
          if [ -z "$providers" ]; then echo "No search provider was ticked; nothing to do."; exit 0; fi
          args+=(--providers "${providers#,}")
          if [ "$PROVIDER_CHECK" = "true" ]; then
            args=(--check-providers --providers "${providers#,}")
          else
            if [ -n "$MAX_QUERIES" ]; then args+=(--max-queries "$MAX_QUERIES"); fi
            if [ -n "$REGION" ]; then args+=(--region "$REGION"); fi
            if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
            if [ "$COMPARE" = "true" ]; then
              args+=(--compare)
              if [ -n "$COMPARE_QUERIES" ]; then args+=(--compare-queries "$COMPARE_QUERIES"); fi
            fi
          fi
          { echo "### Research"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel research "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Read the pages behind the results
        id: readpages
        if: inputs.dry_run != true && inputs.provider_check != true && inputs.read_pages != '0' && inputs.read_pages != ''
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          READ_PAGES: ${{ inputs.read_pages }}
          OBSERVATORY_CONTACT: ${{ secrets.OBSERVATORY_CONTACT }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          set +e
          args=(corpus --what deepread --top "$READ_PAGES")
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args+=(--brand "$BRAND"); else args+=(--all); fi
          { echo "### Pages read"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel observatory "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Update Google Sheets
        id: sheets
        if: inputs.dry_run != true
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_SHARE_EMAIL: ${{ secrets.SHEET_SHARE_EMAIL }}
          SHEET_FOLDER_ID: ${{ secrets.SHEET_FOLDER_ID }}
        run: |
          set +e
          args=(--all)
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args=(--brand "$BRAND"); fi
          { echo "### Google Sheets"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel sheets "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Save the data
        shell: bash
        run: |
          git config user.name "catalogue-research"
          git config user.email "catalogue-research@users.noreply.github.com"
          git add -f data
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Research $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      - name: Alert if research needs attention
        if: steps.research.outcome == 'failure' || steps.sheets.outcome == 'failure'
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"Research needs attention: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi

      - name: Show the run as red when attention is needed
        if: steps.research.outcome == 'failure' || steps.sheets.outcome == 'failure'
        run: exit 1
