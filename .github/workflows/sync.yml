# Scheduled catalogue sync for every brand in brands/.
# Not run yet: this needs a first real run in your GitHub repo (see README).
name: Catalogue sync

on:
  schedule:
    - cron: "17 5 * * *"        # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write                # lets the job commit the data/ folder

concurrency:
  group: catalogue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync catalogues
        id: sync
        continue-on-error: true
        run: python -m contentintel sync --all --sitemap

      - name: Save snapshots and the run log
        run: |
          git config user.name "catalogue-sync"
          git config user.email "catalogue-sync@users.noreply.github.com"
          git add -f data
          git diff --cached --quiet || git commit -m "Catalogue sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Alert if a catalogue needs attention
        if: steps.sync.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"Catalogue sync needs attention: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi

      - name: Fail the run so it shows red
        if: steps.sync.outcome == 'failure'
        run: exit 1
