# Fetches each brand's catalogue, checks it, and saves the results in the data/ folder.
# Runs daily by itself. To run it now: Actions > Catalogue sync > Run workflow.
# A red run means a person should look (the run page shows a plain-English report).
name: Catalogue sync

on:
  schedule:
    - cron: "17 5 * * *"        # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand folder name (for example swoveralls) or all"
        required: true
        default: "all"

permissions:
  contents: write                # lets the job save the data/ folder

# Sync and admin jobs share one lane so two runs never write the data at once.
concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Sync catalogues
        id: sync
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
        run: |
          set +e
          args=(--all)
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args=(--brand "$BRAND"); fi
          { echo "### Catalogue sync"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel sync "${args[@]}" --sitemap 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Save the data
        shell: bash
        run: |
          git config user.name "catalogue-sync"
          git config user.email "catalogue-sync@users.noreply.github.com"
          git add -f data
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Catalogue sync $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      - name: Alert if a catalogue needs attention
        if: steps.sync.outcome == 'failure'
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"Catalogue sync needs attention: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi

      - name: Show the run as red when attention is needed
        if: steps.sync.outcome == 'failure'
        run: exit 1
