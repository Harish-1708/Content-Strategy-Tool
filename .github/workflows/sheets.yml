# Updates each brand's Google Sheet on demand (the Catalogue sync workflow also does this
# after every sync). Use this to set a sheet up for the first time or to preview with a dry run.
# Actions > Google Sheets > Run workflow.
name: Google Sheets

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand folder name (for example swoveralls) or all"
        required: true
        default: "all"
      dry_run:
        description: "Show what would change without writing anything"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Update Google Sheets
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          DRY_RUN: ${{ inputs.dry_run }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_SHARE_EMAIL: ${{ secrets.SHEET_SHARE_EMAIL }}
          SHEET_FOLDER_ID: ${{ secrets.SHEET_FOLDER_ID }}
        run: |
          set +e
          args=(--all)
          if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args=(--brand "$BRAND"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          { echo "### Google Sheets"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel sheets "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Save the data
        if: always()
        shell: bash
        run: |
          git config user.name "catalogue-sheets"
          git config user.email "catalogue-sheets@users.noreply.github.com"
          git add -f data
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Google Sheets: remember which spreadsheet belongs to each brand"
            git pull --rebase
            git push
          fi
