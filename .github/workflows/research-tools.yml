# The research tools added by Update 64. Each one is an external repository used as it is, with the platform's own version as the backup, under your ON/OFF switches (Controls tab):
#   voice      audience voice: what people say about a topic, the brand or its competitors, with real engagement (last30days-skill; Reddit, Hacker News, YouTube, GitHub, Polymarket and more)
#   analyze    the facts of one video address (yt-dlp: views, sound, captions, who posted) and/or the pace of one video file (ffmpeg)
#   pool       free AI capacity worth adding to the pool, from OmniRoute's catalogue read as data (changes nothing)
#   assets     licence-safe pictures or sounds for a query (Openverse, with Wikimedia Commons as the backup)
#   motion     motion formats close to a text, from the prompt library (awesome-opus5-5-videos)
#   pageid     tries the four places a Facebook page id can be read from (Chobani is the first one to try) and says what each gave
#   install    installs or updates the connections these tools use (also done automatically before each tool)
# To run it: Actions > Research tools > Run workflow. Nothing here posts or changes anything on any platform; voice and assets keep what they found next to the brand's data.
name: Research tools

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "What to run"
        type: choice
        options: [voice, analyze, pool, assets, motion, pageid, install]
        default: voice
      brand:
        description: "voice and assets: brand folder name (for example swoveralls) or all (voice only)"
        required: false
        default: "all"
      mode:
        description: "voice: research (a topic), competitors (the brand's benchmark brands side by side) or discover (what is accelerating)"
        type: choice
        options: [research, competitors, discover]
        default: research
      topic:
        description: "voice: a topic to ask about (blank: the brand's biggest product categories and its name). Also the text for assets and motion"
        required: false
        default: ""
      peers:
        description: "voice, competitors mode: comma-separated names (blank: the brand's benchmark brands)"
        required: false
        default: ""
      depth:
        description: "voice: quick or deep (deep reads more and takes longer)"
        type: choice
        options: [quick, deep]
        default: quick
      url:
        description: "analyze: a public video address (TikTok, Instagram, Facebook, YouTube...). pageid: a Facebook page address, for example https://www.facebook.com/Chobani"
        required: false
        default: ""
      kind:
        description: "assets: images or audio"
        type: choice
        options: [images, audio]
        default: images
      apify:
        description: "voice (research mode): also ask Apify's TikTok and Instagram scrapers (ON by default; needs APIFY_TOKEN; at most 40 items in the whole run and 60 a month for voice, each call capped at 0.25 dollars, and never beyond the Collect step's Apify allowance in research.yaml). Untick to switch it off"
        type: boolean
        default: true
      dry_run:
        description: "voice: show what would be asked and ask nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Install ffmpeg (measures how a video moves; the runner does not have it)
        if: inputs.tool == 'analyze'
        shell: bash
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq ffmpeg || echo "ffmpeg could not be installed: pace will not be measured"

      - name: Install the connections these tools use
        shell: bash
        env:
          TOOL: ${{ inputs.tool }}
        run: |
          set +e
          keys=()
          case "$TOOL" in
            voice) keys=(last30days) ;;
            analyze) keys=(yt_dlp) ;;
            pool) keys=(omniroute_catalog) ;;
            motion) keys=(opus_video_prompts) ;;
            install) keys=(last30days yt_dlp omniroute_catalog opus_video_prompts fb_ads_library_mcp) ;;
          esac
          { echo "### Connections"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          for key in "${keys[@]}"; do
            python -m contentintel observatory connections --all --what install --key "$key" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || echo "$key could not be installed: the platform's own version is used instead" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ffmpeg -version | head -1 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Read the gateway's own provider list (pool tool)
        if: inputs.tool == 'pool'
        shell: bash
        run: |
          set +e
          tag=$(python -c "import json;print(json.load(open('ai/gateway.lock.json'))['gateway']['tag'])")
          if git clone --depth 1 --branch "$tag" https://github.com/tashfeenahmed/freellmapi gateway-src 2>&1 | tail -1; then
            echo "Gateway source $tag read: its own provider list is used." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Gateway source could not be read: the built-in list of its providers is used instead." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run the tool
        id: run
        shell: bash
        env:
          TOOL: ${{ inputs.tool }}
          BRAND: ${{ inputs.brand }}
          MODE: ${{ inputs.mode }}
          TOPIC: ${{ inputs.topic }}
          PEERS: ${{ inputs.peers }}
          DEPTH: ${{ inputs.depth }}
          VIDEO_URL: ${{ inputs.url }}
          KIND: ${{ inputs.kind }}
          DRY_RUN: ${{ inputs.dry_run }}
          USE_APIFY: ${{ inputs.apify }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
        run: |
          set +e
          args=()
          case "$TOOL" in
            voice)
              args=(voice --mode "$MODE" --depth "$DEPTH")
              if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args+=(--brand "$BRAND"); else args+=(--all); fi
              if [ -n "$TOPIC" ]; then args+=(--topic "$TOPIC"); fi
              if [ -n "$PEERS" ]; then args+=(--peers "$PEERS"); fi
              if [ "$USE_APIFY" = "false" ]; then args+=(--no-apify); fi
              if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi ;;
            analyze) args=(analyze); if [ -n "$VIDEO_URL" ]; then args+=(--url "$VIDEO_URL" --comments --pace); fi ;;
            pool) args=(pool); if [ -d gateway-src ]; then args+=(--gateway-dir gateway-src); fi ;;
            assets)
              args=(assets --query "$TOPIC" --kind "$KIND")
              if [ -n "$BRAND" ] && [ "$BRAND" != "all" ]; then args+=(--brand "$BRAND"); fi ;;
            motion) args=(motion --query "$TOPIC") ;;
            pageid) args=(pageid --url "$VIDEO_URL") ;;
            install) echo "Connections installed in the step above."; exit 0 ;;
          esac
          { echo "### ${TOOL}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Save the data
        if: inputs.tool == 'voice' || inputs.tool == 'assets'
        shell: bash
        run: |
          git config user.name "research-tools"
          git config user.email "research-tools@users.noreply.github.com"
          git add -f data
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Research tools $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
