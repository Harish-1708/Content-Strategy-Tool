# Writes a creative brief from the Idea Bank rows a person marked Use (only those), with the pictures saved in Drive, checked
# against the brief's own rules (briefs/<name>/rules.yaml). The result is a Word file in the repository (data/<brand>/briefs/) and in
# the brand's Briefs folder in the Shared Drive, with a row in the brand sheet's Briefs tab.
# Before running it: run the Sheets update, review the Idea Bank tab and mark the rows you want as Use.
name: Brief

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand folder name (for example swoveralls)"
        required: true
      brief:
        description: "The brief's rules folder under briefs/ (for example swoveralls-new-audience)"
        required: true
      ask:
        description: "What the brief is for, in your own words"
        required: true
      request_id:
        description: "Only use items found by this request, for example RQ-0001 (blank uses every approved item)"
        required: false
        default: ""
      include_maybe:
        description: "Also use rows marked Maybe"
        type: boolean
        default: false
      refresh_story_bank:
        description: "Refresh the brand's story bank from public sources first (it only ever ADDS unverified facts and conflicts; a failure never stops the brief)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FREEAPI_ENCRYPTION_KEY: ${{ secrets.FREEAPI_ENCRYPTION_KEY }}
      FREEAPI_ADMIN_PASSWORD: ${{ secrets.FREEAPI_ADMIN_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
      ANYAPI_API_KEY: ${{ secrets.ANYAPI_API_KEY }}
      NAVY_API_KEY: ${{ secrets.NAVY_API_KEY }}
      API_AIRFORCE_API_KEY: ${{ secrets.API_AIRFORCE_API_KEY }}
      BLUESMINDS_API_KEY: ${{ secrets.BLUESMINDS_API_KEY }}
      BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Set up the free provider pool
        uses: ./.github/actions/ai-pool


      - name: Refresh the story bank first
        if: inputs.refresh_story_bank
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          { echo "### Story-bank refresh"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel canon --action refresh --brand "$BRAND" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Write the brief
        id: brief
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          BRIEF: ${{ inputs.brief }}
          ASK: ${{ inputs.ask }}
          REQUEST_ID: ${{ inputs.request_id }}
          INCLUDE_MAYBE: ${{ inputs.include_maybe }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          IDEA_BANK_FOLDER_ID: ${{ secrets.IDEA_BANK_FOLDER_ID }}
          SHEET_SHARE_EMAIL: ${{ secrets.SHEET_SHARE_EMAIL }}
          SHEET_FOLDER_ID: ${{ secrets.SHEET_FOLDER_ID }}
        run: |
          set +e
          args=(--brand "$BRAND" --brief "$BRIEF" --ask "$ASK")
          if [ -n "$REQUEST_ID" ]; then args+=(--request "$REQUEST_ID"); fi
          if [ "$INCLUDE_MAYBE" = "true" ]; then args+=(--include-maybe); fi
          { echo "### Brief"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel brief "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Update Google Sheets
        id: sheets
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_SHARE_EMAIL: ${{ secrets.SHEET_SHARE_EMAIL }}
          SHEET_FOLDER_ID: ${{ secrets.SHEET_FOLDER_ID }}
        run: |
          set +e
          { echo "### Google Sheets"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel sheets --brand "$BRAND" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Save the data
        shell: bash
        run: |
          git config user.name "catalogue-brief"
          git config user.email "catalogue-brief@users.noreply.github.com"
          git add -f data
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Brief $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      - name: Show the run as red when attention is needed
        if: steps.brief.outcome == 'failure' || steps.sheets.outcome == 'failure'
        run: exit 1
