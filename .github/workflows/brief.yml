# Writes a creative brief from the Idea Bank rows a person marked Use (only those), with the pictures saved in Drive, checked
# against the brief's own rules (briefs/<name>/rules.yaml). The result is a Word file in the repository (data/<brand>/briefs/) and in
# the brand's Briefs folder in the Shared Drive, with a row in the brand sheet's Briefs tab.
# Before running it: run the Sheets update, review the Idea Bank tab and mark the rows you want as Use.
name: Brief

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand folder name (for example swoveralls)"
        required: true
      brief:
        description: "The brief's rules folder under briefs/ (for example swoveralls-new-audience)"
        required: true
      ask:
        description: "What the brief is for, in your own words"
        required: true
      request_id:
        description: "Only use items found by this request, for example RQ-0001 (blank uses every approved item)"
        required: false
        default: ""
      include_maybe:
        description: "Also use rows marked Maybe"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: catalogue-data
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Write the brief
        id: brief
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          BRIEF: ${{ inputs.brief }}
          ASK: ${{ inputs.ask }}
          REQUEST_ID: ${{ inputs.request_id }}
          INCLUDE_MAYBE: ${{ inputs.include_maybe }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          IDEA_BANK_FOLDER_ID: ${{ secrets.IDEA_BANK_FOLDER_ID }}
          SHEET_SHARE_EMAIL: ${{ secrets.SHEET_SHARE_EMAIL }}
          SHEET_FOLDER_ID: ${{ secrets.SHEET_FOLDER_ID }}
        run: |
          set +e
          args=(--brand "$BRAND" --brief "$BRIEF" --ask "$ASK")
          if [ -n "$REQUEST_ID" ]; then args+=(--request "$REQUEST_ID"); fi
          if [ "$INCLUDE_MAYBE" = "true" ]; then args+=(--include-maybe); fi
          { echo "### Brief"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel brief "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Update Google Sheets
        id: sheets
        continue-on-error: true
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_SHARE_EMAIL: ${{ secrets.SHEET_SHARE_EMAIL }}
          SHEET_FOLDER_ID: ${{ secrets.SHEET_FOLDER_ID }}
        run: |
          set +e
          { echo "### Google Sheets"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m contentintel sheets --brand "$BRAND" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Save the data
        shell: bash
        run: |
          git config user.name "catalogue-brief"
          git config user.email "catalogue-brief@users.noreply.github.com"
          git add -f data
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Brief $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      - name: Show the run as red when attention is needed
        if: steps.brief.outcome == 'failure' || steps.sheets.outcome == 'failure'
        run: exit 1
