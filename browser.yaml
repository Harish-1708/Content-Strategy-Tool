# How the tool drives a real (headless) browser to read Meta Ad Library, Instagram, TikTok and
# Gemini Deep Research. Every address, button name and check below is a FIRST GUESS written without
# being able to see the live sites. When a site changes, or a run says it cannot find something,
# edit it here: no code change is needed. Actions > Collect > "Recon" saves screenshots and the
# data each site sends, which shows exactly what to change.
#
# Logging in: Instagram, TikTok and Google often stop automated logins from GitHub's servers with
# a code or a puzzle. The reliable way is to log in ONCE as the dummy account in an ordinary
# browser, export its cookies (for example with the Cookie-Editor extension, "Export as JSON"), and
# paste the JSON into the repository secret named below. The username/password route is a
# fallback, controlled per site by `password_fallback`: no_cookies_only (the default) uses it only when no
# cookies are given; when_cookies_fail also uses it when the site plainly rejected the cookies (a warning
# line then asks you to refresh them); never never uses it. It can still stop at a code or a puzzle, and then the account rests.
# With the stealth layer on (below, the default), a session is cookie-only whatever `password_fallback` says: a missing or expired cookie
# means "nothing was read", never a fresh login from the runner. Turn the layer off and the old fallback behaviour returns exactly as before.
# Google blocks automated sign-in, so Gemini uses cookies only.
pacing:
  min_delay_seconds: 3          # a random pause before opening each page
  max_delay_seconds: 8
  scroll_pause_seconds: 3       # a random pause after each scroll

# Human-like browsing for the sessions that are LOGGED IN with an account (Instagram, TikTok): see contentintel/human.py. A person does not open a page after a fixed pause and jump two thousand
# pixels down it, so the browser pauses the way reading time varies, settles on a page, moves the mouse, scrolls in several small turns (now and then a little back up) and takes a longer break after
# every few pages. It only looks: it never clicks, likes, follows, posts or messages. A page opened without an account (the public Meta Ads library) keeps the plain pauses above.
# Set `enabled: false` to go back to the plain pauses and jumps. Every number below is a range [smallest, largest].
human:
  enabled: true
  settle_seconds: [1.5, 4.0]        # looking at the page after it has opened
  wheel_steps: [5, 9]               # one scroll is this many small wheel turns
  wheel_step_pixels: [120, 420]
  wheel_step_ms: [40, 160]          # the moment each turn takes
  scroll_back_chance: 0.12          # now and then a little scroll back up
  scroll_back_pixels: [80, 300]
  reading_variation: 0.35           # how much reading time varies (0 = never)
  distraction_chance: 0.08          # now and then a longer pause, as when someone looks away
  distraction_factor: [2.0, 4.0]
  mouse_moves: true
  type_ms: [70, 180]            # the gap between keystrokes, in milliseconds (typing is one key at a time; long text is pasted)
  typo_chance: 0.06             # now and then a typo that is noticed and corrected
  dwell_wpm: 200                # the dwell after a page opens is proportional to how much text it holds, at about this many words a minute
  break_every_pages: [6, 10]        # a longer break after this many pages
  break_seconds: [20, 60]

# Stealth / human-behaviour layer for the sessions that are LOGGED IN with an account: see contentintel/stealth.py and docs/platform/stealth.md.
# A plain headless browser with one fixed user agent and one fixed viewport, coming from a datacenter address, is the shape of an automated read —
# and the shape an account warning names. This layer gives each account one stable identity (a pinned user agent, viewport, timezone and proxy,
# written to data/_shared/stealth-identities.json the first time the account is seen and reused on every later run), and reads through a stealth
# browser (Camoufox first IF it is installed, which it is not today because its latest release needs an older Playwright than this repo pins, so in practice patchright headed under Xvfb, then plain Playwright last). It also logs every read (page, timing, IP, human score)
# to the run's debug directory, so a future warning can be traced back to what the account actually did.
# Set `enabled: false` to turn the whole layer off: every read then behaves exactly as it did before it existed.
stealth:
  enabled: true
  engine: auto                  # auto (Camoufox, then patchright, then plain), or one of camoufox, patchright, plain
  humanize: true                # Camoufox: move the mouse and type the way a person does
  geoip: true                   # Camoufox: derive the timezone and locale from the proxy's address, so the browser's story matches where it comes from
  identities_file: data/_shared/stealth-identities.json
  profiles_root: .stealth-profiles   # outside data/ on purpose: the workflows commit data/, and a browser profile holds session cookies and can be hundreds of megabytes (it is git-ignored)
  proxy_secret: STEALTH_PROXY_URL   # the secret holding the proxy address; each account can also have its own STEALTH_PROXY_<SITE> (e.g. STEALTH_PROXY_INSTAGRAM)
  log_reads: true               # write one line per read to the run's debug directory (read-log.jsonl) and add one line to the run report
  shuffle_reads: true           # read the planned pages in a shuffled order (careful mode keeps its own rotation and is never shuffled)

limits:
  max_scrolls_per_page: 8       # how far down a results page it will scroll

sites:
  meta_ads:                     # public pages: no login needed
    # No warmup: block here on purpose — the Ad Library reads are public pages, not a logged-in session, and
    # there is no clearance token to mint for them. Warm-up is a TikTok/Instagram session step only.
    needs_login: false
    json_url_hints: [graphql]
    settle_seconds: 4
    consent_any: ['button:has-text("Allow all cookies")', 'button:has-text("Accept all")', 'button:has-text("Only allow essential cookies")']

  instagram:
    needs_login: true
    secrets: {cookies: INSTAGRAM_COOKIES, username: INSTAGRAM_USERNAME, password: INSTAGRAM_PASSWORD}
    home: https://www.instagram.com/
    password_fallback: when_cookies_fail   # applies ONLY when the stealth identity allows a login. With the stealth layer on (the default) the collectors are cookie-only and this never fires, by design; the one password login is the manual Sessions password backup (its own routine). A refused session says so in its message.
    settle_seconds: 20            # Instagram draws its grid slowly: wait this long after opening a page (the general default is 3; it was 10, and Acceptance #15 read the grid half drawn)
    scroll_pause_seconds: 10      # and this long after each scroll (it was 6), so more posts have loaded before the next read (Careful Mode's pacing, below, overrides it)
    # After the fixed waits above, also wait for the grid itself: until every image on the page has loaded and the loading spinner is gone (twice in a row), up to max_seconds, before anything is read.
    settle_images: {images_any: ['main img', 'article img'], tiles_any: ['main a[href*="/p/"]', 'main a[href*="/reel/"]', 'article a[href*="/p/"]'], spinner_any: ['[role="progressbar"]', 'svg[aria-label*="Loading" i]', '[data-visualcompletion="loading-state"]', '[aria-busy="true"]'], max_seconds: 60, poll_seconds: 3, stable_polls: 2, stall_polls: 8}
    hashtag_url: https://www.instagram.com/explore/tags/{tag}/
    # Warm-up (see contentintel/warmup.py): one public profile page and one public post page, visited before any
    # listing read, so the session arrives with its cookies refreshed by real page loads. Instagram has no WAF
    # clearance cookie, so the poll looks for csrftoken only — it confirms the session cookies are present after
    # a real page load. The post address is a public post used as an example: if it goes stale the visit is
    # skipped and the run carries on — replace it with any live public post.
    warmup:
      enabled: true
      urls: [https://www.instagram.com/instagram/, https://www.instagram.com/p/Cuw6X2mOqXG/]
      token: csrftoken
      wait_seconds: 5
      poll_seconds: 10
    json_url_hints: [graphql, /api/v1/]
    link_contains: ['/p/', '/reel/']
    logged_in_any: ['a[href="/direct/inbox/"]', 'svg[aria-label="Home"]', 'a[href="/explore/"]']
    login_wall_any: ['input[name="username"]', 'a[href="/accounts/login/"]']
    # Instagram's login page can sit in front of a hashtag while its header links still look signed in, so these win over the signed-in markers (found in the debug capture of Collect #59: a 'Log into Instagram' page and a 12-item read that looked normal)
    signed_out_any: ['text=Log into Instagram', 'input[name="email"]']
    challenge_any: ['text=Suspicious Login Attempt', 'text=We detected an unusual login attempt', 'input[name="verificationCode"]', 'text=Confirm it']
    # An ACCOUNT warning (as opposed to a login check): the tool stops using the account at once and rests it
    # (collectors.safety.cooldown_days in research.yaml). The phrases are deliberately strict so an ordinary caption cannot
    # match. The first two are Instagram's own wording from a real warning ("We've detected automated behavior on your
    # account ... ensure that no other users or tools have access to your account"); the rest are wording it is known to
    # use. An address containing one of the parts below counts too.
    warning_any: ['text=detected automated behavior', 'text=no other users or tools have access to your account', 'text=We suspect automated behavior', 'text=Action Blocked', 'text=We restrict certain activity', 'text=Your account has been temporarily locked']
    warning_url_any: ['/accounts/suspended', '/accounts/disabled', '/challenge/']
    # CAREFUL MODE for this account is ON by default since Update 68 (the owner's decision after Meta's automation warning): slower, smaller, spread over several
    # runs. To switch it off, put a # in front of the lines below.
    pacing: {min_delay_seconds: 20, max_delay_seconds: 60, scroll_pause_seconds: 12}   # a long pause before each page and each scroll (the scroll pause was 8)
    max_scrolls_per_page: 3          # scroll a little, not to the bottom
    max_pages_per_run: 2             # hashtag pages opened in one run; the next run carries on from where this one stopped
    max_pages_per_day: 4             # and never more than this many in a day, however often it is run
    min_hours_between_runs: 12       # and the account is not read again until this many hours after it was last read (the gap)
    login_steps:
      - {goto: 'https://www.instagram.com/accounts/login/'}
      - {wait: 3}
      - {click_optional: ['button:has-text("Allow all cookies")', 'button:has-text("Accept")']}
      - {fill: ['input[name="username"]'], with: username}
      - {fill: ['input[name="password"]'], with: password}
      - {click: ['button[type="submit"]']}
      - {wait: 8}
      - {click_optional: ['button:has-text("Not now")', 'div[role="button"]:has-text("Not now")']}
      - {wait: 2}

  tiktok:
    needs_login: true
    secrets: {cookies: TIKTOK_COOKIES, username: TIKTOK_USERNAME, password: TIKTOK_PASSWORD}
    password_fallback: when_cookies_fail   # applies ONLY when the stealth identity allows a login. With the stealth layer on (the default) the collectors are cookie-only and this never fires, by design; the one password login is the manual Sessions password backup (its own routine). A refused session says so in its message.
    max_pages_per_run: 2             # careful mode, as for Instagram: pages opened in one run
    max_pages_per_day: 4             # and in a day
    min_hours_between_runs: 12       # and the gap between runs
    home: https://www.tiktok.com/
    hashtag_url: https://www.tiktok.com/tag/{tag}
    profile_url: https://www.tiktok.com/@{name}
    search_url: https://www.tiktok.com/search?q={q}
    # Warm-up (see contentintel/warmup.py): TikTok's WAF mints _waftokenid per page kind — a video-page token clears
    # only video pages, a profile-page token only profile pages, and the homepage mints none. So one public video
    # page and one public profile page are visited first, a few seconds each, and the cookie jar is polled for the
    # token before any tag/search page is opened. The video is @tiktok's own, verified live 2026-11-16. A stale or
    # missing page never fails the run: that visit is skipped and the run carries on.
    warmup:
      enabled: true
      urls: [https://www.tiktok.com/@tiktok/video/7238789584926477594, https://www.tiktok.com/@tiktok]
      token: _waftokenid
      wait_seconds: 5
      poll_seconds: 10
    # Search-first for hashtags: search for "#tag" before opening the tag page, the way a person would. The
    # collectors side reads this flag in run_browser_task; the flag defaults to false when absent.
    hashtag_via_search_first: true
    json_url_hints: [/api/]
    link_contains: ['/video/']
    logged_in_any: ['[data-e2e="profile-icon"]', '[data-e2e="inbox-icon"]', 'a[href*="/upload"]']
    login_wall_any: ['[data-e2e="top-login-button"]', 'button:has-text("Log in")']
    # The puzzle variant Collect #64 actually showed ("Drag the puzzle piece into place") was NOT in this list, so
    # the tool never detected the challenge, never pressed its X, and never fell back to search. Verified against
    # the run's own debug page (empty-tiktok.html): that text 1x, #captcha-verify-container-main-page 1x,
    # #captcha_slide_button 1x, #captcha_close_button 1x — and the four older entries 0x each. The three new
    # markers are those verified ones; the old four stay, because other variants may still occur. Honest limit:
    # detection unlocks the close-once + search fallback, it does not guarantee posts — behind the Collect #64
    # modal the page held no videos at all, so pressing X alone would not have saved that read.
    challenge_any: ['text=Verify to continue', 'text=Drag the slider', '#captcha-verify-image', 'text=Select 2 objects', 'text=Drag the puzzle piece into place', '#captcha-verify-container-main-page', '#captcha_slide_button']
    # An ACCOUNT warning: the tool stops using the account at once and rests it. Strict phrases, not yet checked against a real one.
    warning_any: ['text=Maximum number of attempts reached', 'text=Your account has been suspended', 'text=Your account is temporarily restricted']
    challenge_dismiss: ['#captcha_close_button']      # the puzzle's own X: pressed once, the puzzle itself is never solved
    # In the automated browser a hashtag page can say "Something went wrong" while the same search works by hand
    # (seen on 2026-10-21). When that happens, or a puzzle covers the page, the tag is searched instead, as "#tag",
    # the way a person would.
    error_any: ['text=Something went wrong']
    hashtag_via_search_on_error: true
    # The search box, as it is on the real page: <input data-e2e="search-user-input" name="q" type="search">.
    # A real run types "#tag" here and presses Enter, exactly as a person does.
    search_box: ['input[data-e2e="search-user-input"]', 'input[type="search"][name="q"]']
    login_steps:
      - {goto: 'https://www.tiktok.com/login/phone-or-email/email'}
      - {wait: 4}
      - {click_optional: ['button:has-text("Accept all")', 'button:has-text("Allow all")']}
      - {fill: ['input[name="username"]', 'input[placeholder*="Email"]'], with: username}
      - {fill: ['input[type="password"]'], with: password}
      - {click: ['button[type="submit"]', 'button[data-e2e="login-button"]']}
      - {wait: 10}

  gemini:                       # Deep Research through the Gemini web app, waiting for the report
    needs_login: true
    secrets: {cookies: GEMINI_COOKIES}
    app_url: https://gemini.google.com/app
    logged_in_any: ['rich-textarea', 'div[contenteditable="true"]']
    login_wall_any: ['a[href*="accounts.google.com/ServiceLogin"]', 'a:has-text("Sign in")']
    # Gemini shows its prompt box to signed-out visitors too, so a visible Sign in link must win over the prompt box
    # (found when a signed-out page was reported as logged in).
    signed_out_any: ['a[href*="accounts.google.com/ServiceLogin"]', 'a[aria-label="Sign in"]']
    prompt_box: ['rich-textarea div[contenteditable="true"]', 'div.ql-editor[contenteditable="true"]', 'div[role="textbox"]', 'textarea']
    # TWO LAYOUTS, tried in this order: (1) "Deep research" as a DIRECT item of the open menu (the run's debug files of Acceptance #15 show this, with no "More tools"): click it and stop; (2) otherwise "More tools",
    # then "Deep research" inside its submenu (the owner's screenshot of 2026-11-23). Only a live Acceptance proves which one a given account sees.
    deep_research_direct: ['[role="menuitem"]:has-text("Deep research")', '[role="menuitemcheckbox"]:has-text("Deep research")', 'button.mat-mdc-menu-item:has-text("Deep research")', '.mat-mdc-menu-item:has-text("Deep research")', 'li:has-text("Deep research")']
    deep_research_clicks:       # buttons to press, in order, to switch the chat to Deep Research
      # Gemini's menu, read from the real page and a screenshot on 2026-10-21: the + at the left of the prompt box
      # (its label is "Upload & tools"), then "More tools", then "Deep research".
      - ['button[aria-label="Upload & tools"]', 'button[aria-label*="Upload"][aria-haspopup="menu"]', 'button[aria-label*="tools" i]']
      # Live layout seen on 2026-11-23: that button opens a menu (Upload files, Add from Drive, More uploads, Create image, Create video, More tools); "More tools" opens a SECOND menu (Create music, Canvas, Deep Research,
      # Guided Learning, Personal Intelligence Labs), Deep Research third. Step 2 failed on the first selector set, so every kind of menu item is tried, and the code hovers the item when a click finds nothing.
      - ['[role="menuitem"]:has-text("More tools")', '[role="menuitemcheckbox"]:has-text("More tools")', '[role="menuitemradio"]:has-text("More tools")', 'button.mat-mdc-menu-item:has-text("More tools")', '.mat-mdc-menu-item:has-text("More tools")', '[aria-haspopup="menu"]:has-text("More tools")', 'button:has-text("More tools")', 'div[role="button"]:has-text("More tools")', 'li:has-text("More tools")', 'text=/More tools/i']
      - ['[role="menuitem"]:has-text("Deep research")', '[role="menuitemcheckbox"]:has-text("Deep research")', 'button.mat-mdc-menu-item:has-text("Deep research")', '.mat-mdc-menu-item:has-text("Deep research")', 'button:has-text("Deep research")', 'li:has-text("Deep research")', 'text=/Deep research/i']
    # Shown once Deep Research is switched on: the prompt box then asks "What do you want to research?".
    # If none of these is seen the run carries on and says so (it never stops a good run over this).
    deep_research_active_any: ['[data-placeholder*="research" i]', 'text=What do you want to research?']
    send: ['button[aria-label*="Send"]', 'button:has-text("Send")']
    start_research: ['button:has-text("Start research")', 'text=Start research']
    still_working_any: ['button[aria-label*="Stop"]', 'text=Researching', 'text=Working on it']
    done_any: ['button:has-text("Export")', 'text=Export to Docs', 'button:has-text("Create")']
    response: ['message-content', 'model-response', 'div.markdown']
    wait:
      max_minutes: 25           # the whole run, including the 10+ minutes a report usually takes
      plan_wait_seconds: 120    # how long to wait for the plan and its "Start research" button
      poll_seconds: 15
      settle_seconds: 90        # the report counts as finished once the text stops changing this long
      question_settle_seconds: 20  # Gemini has stopped and is not offering to start: it is probably asking a question
      min_chars: 1500
