# How the tool drives a real (headless) browser to read Meta Ad Library, Instagram, TikTok and
# Gemini Deep Research. Every address, button name and check below is a FIRST GUESS written without
# being able to see the live sites. When a site changes, or a run says it cannot find something,
# edit it here: no code change is needed. Actions > Collect > "Recon" saves screenshots and the
# data each site sends, which shows exactly what to change.
#
# Logging in: Instagram, TikTok and Google often stop automated logins from GitHub's servers with
# a code or a puzzle. The reliable way is to log in ONCE as the dummy account in an ordinary
# browser, export its cookies (for example with the Cookie-Editor extension, "Export as JSON"), and
# paste the JSON into the repository secret named below. The username/password route is only a
# best-effort fallback. Google blocks automated sign-in, so Gemini uses cookies only.
pacing:
  min_delay_seconds: 3          # a random pause before opening each page
  max_delay_seconds: 8
  scroll_pause_seconds: 3       # a random pause after each scroll
limits:
  max_scrolls_per_page: 8       # how far down a results page it will scroll

sites:
  meta_ads:                     # public pages: no login needed
    needs_login: false
    json_url_hints: [graphql]
    settle_seconds: 4
    consent_any: ['button:has-text("Allow all cookies")', 'button:has-text("Accept all")', 'button:has-text("Only allow essential cookies")']

  instagram:
    needs_login: true
    secrets: {cookies: INSTAGRAM_COOKIES, username: INSTAGRAM_USERNAME, password: INSTAGRAM_PASSWORD}
    home: https://www.instagram.com/
    hashtag_url: https://www.instagram.com/explore/tags/{tag}/
    json_url_hints: [graphql, /api/v1/]
    link_contains: ['/p/', '/reel/']
    logged_in_any: ['a[href="/direct/inbox/"]', 'svg[aria-label="Home"]', 'a[href="/explore/"]']
    login_wall_any: ['input[name="username"]', 'a[href="/accounts/login/"]']
    challenge_any: ['text=Suspicious Login Attempt', 'text=We detected an unusual login attempt', 'input[name="verificationCode"]', 'text=Confirm it']
    # An ACCOUNT warning (as opposed to a login check): the tool stops using the account at once and rests it
    # (collectors.safety.cooldown_days in research.yaml). The phrases are deliberately strict so an ordinary caption cannot
    # match. The first two are Instagram's own wording from a real warning ("We've detected automated behavior on your
    # account ... ensure that no other users or tools have access to your account"); the rest are wording it is known to
    # use. An address containing one of the parts below counts too.
    warning_any: ['text=detected automated behavior', 'text=no other users or tools have access to your account', 'text=We suspect automated behavior', 'text=Action Blocked', 'text=We restrict certain activity', 'text=Your account has been temporarily locked']
    warning_url_any: ['/accounts/suspended', '/accounts/disabled', '/challenge/']
    # CAREFUL MODE for this account: slower, smaller, and spread over several runs. Raise these only if the account stays quiet.
    pacing: {min_delay_seconds: 20, max_delay_seconds: 60, scroll_pause_seconds: 8}   # a long pause before each page and each scroll
    max_scrolls_per_page: 3          # scroll a little, not to the bottom
    max_pages_per_run: 2             # hashtag pages opened in one run; the next run carries on from where this one stopped
    max_pages_per_day: 4             # and never more than this many in a day, however often it is run
    login_steps:
      - {goto: 'https://www.instagram.com/accounts/login/'}
      - {wait: 3}
      - {click_optional: ['button:has-text("Allow all cookies")', 'button:has-text("Accept")']}
      - {fill: ['input[name="username"]'], with: username}
      - {fill: ['input[name="password"]'], with: password}
      - {click: ['button[type="submit"]']}
      - {wait: 8}
      - {click_optional: ['button:has-text("Not now")', 'div[role="button"]:has-text("Not now")']}
      - {wait: 2}

  tiktok:
    needs_login: true
    secrets: {cookies: TIKTOK_COOKIES, username: TIKTOK_USERNAME, password: TIKTOK_PASSWORD}
    home: https://www.tiktok.com/
    hashtag_url: https://www.tiktok.com/tag/{tag}
    profile_url: https://www.tiktok.com/@{name}
    search_url: https://www.tiktok.com/search?q={q}
    json_url_hints: [/api/]
    link_contains: ['/video/']
    logged_in_any: ['[data-e2e="profile-icon"]', '[data-e2e="inbox-icon"]', 'a[href*="/upload"]']
    login_wall_any: ['[data-e2e="top-login-button"]', 'button:has-text("Log in")']
    challenge_any: ['text=Verify to continue', 'text=Drag the slider', '#captcha-verify-image', 'text=Select 2 objects']
    # An ACCOUNT warning: the tool stops using the account at once and rests it. Strict phrases, not yet checked against a real one.
    warning_any: ['text=Maximum number of attempts reached', 'text=Your account has been suspended', 'text=Your account is temporarily restricted']
    challenge_dismiss: ['#captcha_close_button']      # the puzzle's own X: pressed once, the puzzle itself is never solved
    # In the automated browser a hashtag page can say "Something went wrong" while the same search works by hand
    # (seen on 2026-10-21). When that happens, or a puzzle covers the page, the tag is searched instead, as "#tag",
    # the way a person would.
    error_any: ['text=Something went wrong']
    hashtag_via_search_on_error: true
    # The search box, as it is on the real page: <input data-e2e="search-user-input" name="q" type="search">.
    # A real run types "#tag" here and presses Enter, exactly as a person does.
    search_box: ['input[data-e2e="search-user-input"]', 'input[type="search"][name="q"]']
    login_steps:
      - {goto: 'https://www.tiktok.com/login/phone-or-email/email'}
      - {wait: 4}
      - {click_optional: ['button:has-text("Accept all")', 'button:has-text("Allow all")']}
      - {fill: ['input[name="username"]', 'input[placeholder*="Email"]'], with: username}
      - {fill: ['input[type="password"]'], with: password}
      - {click: ['button[type="submit"]', 'button[data-e2e="login-button"]']}
      - {wait: 10}

  gemini:                       # Deep Research through the Gemini web app, waiting for the report
    needs_login: true
    secrets: {cookies: GEMINI_COOKIES}
    app_url: https://gemini.google.com/app
    logged_in_any: ['rich-textarea', 'div[contenteditable="true"]']
    login_wall_any: ['a[href*="accounts.google.com/ServiceLogin"]', 'a:has-text("Sign in")']
    # Gemini shows its prompt box to signed-out visitors too, so a visible Sign in link must win over the prompt box
    # (found when a signed-out page was reported as logged in).
    signed_out_any: ['a[href*="accounts.google.com/ServiceLogin"]', 'a[aria-label="Sign in"]']
    prompt_box: ['rich-textarea div[contenteditable="true"]', 'div.ql-editor[contenteditable="true"]', 'div[role="textbox"]', 'textarea']
    deep_research_clicks:       # buttons to press, in order, to switch the chat to Deep Research
      # Gemini's menu, read from the real page and a screenshot on 2026-10-21: the + at the left of the prompt box
      # (its label is "Upload & tools"), then "More tools", then "Deep research".
      - ['button[aria-label="Upload & tools"]', 'button[aria-label*="Upload"][aria-haspopup="menu"]', 'button[aria-label*="tools" i]']
      - ['[role="menuitem"]:has-text("More tools")', 'button:has-text("More tools")', 'text=More tools']
      - ['[role="menuitem"]:has-text("Deep research")', 'button:has-text("Deep research")', 'text=Deep research']
    # Shown once Deep Research is switched on: the prompt box then asks "What do you want to research?".
    # If none of these is seen the run carries on and says so (it never stops a good run over this).
    deep_research_active_any: ['[data-placeholder*="research" i]', 'text=What do you want to research?']
    send: ['button[aria-label*="Send"]', 'button:has-text("Send")']
    start_research: ['button:has-text("Start research")', 'text=Start research']
    still_working_any: ['button[aria-label*="Stop"]', 'text=Researching', 'text=Working on it']
    done_any: ['button:has-text("Export")', 'text=Export to Docs', 'button:has-text("Create")']
    response: ['message-content', 'model-response', 'div.markdown']
    wait:
      max_minutes: 25           # the whole run, including the 10+ minutes a report usually takes
      plan_wait_seconds: 120    # how long to wait for the plan and its "Start research" button
      poll_seconds: 15
      settle_seconds: 90        # the report counts as finished once the text stops changing this long
      question_settle_seconds: 20  # Gemini has stopped and is not offering to start: it is probably asking a question
      min_chars: 1500
