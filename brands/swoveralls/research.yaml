# What to research for Swoveralls. Edit this file in GitHub; every research run reads it.
#
# Out of the box the tool only searches for the brand name itself (three searches a week,
# reused for 7 days). Add competitors and topics below to widen it. Each competitor and topic
# becomes a few searches, so a short list goes a long way on free credits.

competitors: []
#  - name: Example Brand
#    domain: example.com

topics: []
#  - overalls outfit ideas

# Searches you want exactly as written. kind is web or news; recency is day, week, month or year.
queries: []
#  - q: "sweatpants overalls trend"
#    kind: news
#    recency: month

auto:
  brand: true
  competitors: true
  topics: true

# ---- ads, social and deep research (collected by Actions > Collect, using a real browser) ---------
# You do NOT need to write much here. Every run, the tool builds a profile of this brand from its catalogue
# (products, price bands, materials, claims) and Claude turns it into what to search for: Meta Ad Library
# keywords, benchmark brands, hashtags and Deep Research questions. They refresh by themselves when the catalogue
# changes. Run Collect with mode "seeds" to see them and the benchmark review list.
#
# Always searched, whatever Claude suggests: the brand's own name (Swoveralls) on Meta ads and on TikTok and
# Instagram hashtags, and its own advertiser page once found. `track_own_brand: false` switches that off.
# Anything you write below is used FIRST, and the automatic seeds are added after it.
#
# auto_seeds: false          # uncomment to stop the automatic seeds for this brand
ads:
  keywords:
    - sweatpant overalls     # the product itself: always searched, even if Claude suggests something else
#   country: us              # two-letter code
#   status: active           # all, active or inactive
#   pages:                   # an advertiser you want to follow: an Ad Library link copied from the browser
#     - https://www.facebook.com/ads/library/?active_status=all&ad_type=all&country=US&view_all_page_id=PAGE_ID_HERE
  benchmark_pages:         # YOUR decision for a benchmark brand Claude suggested; automatic matching never overrides it.
    Allbirds: skip         # no page is named exactly this ("Allbirds ME" is a small regional page)
    Liquid Death: skip     # a drink brand, not loungewear
    Cotopaxi: skip         # outdoor gear
    Dollar Shave Club: skip   # razors
#     Gymshark: 123456789012345                       # a page id,
#     Oodie: https://www.facebook.com/ads/library/?view_all_page_id=123456789012345   # or an Ad Library link,
#     Some Brand: skip                                # or skip to never follow it.
#                              # Run Collect with mode "seeds" or "collect": brands the tool could not match with
#                              # confidence are listed as NEEDS YOU, with the candidate pages and their ids.
# social:
#   tiktok:
#     hashtags: []
#     profiles: []           # accounts to follow, for example a rival's
#   instagram:
#     hashtags: []
# deep_research:
#   context: >               # normally written for you from the catalogue; add facts only you know
#     Anything the catalogue cannot say, for example the audience or the goal of this quarter.
#   questions: []            # extra questions; each one is a Deep Research report (10+ minutes)
