# What to research for Swoveralls. Edit this file in GitHub; every research run reads it.
#
# Out of the box the tool only searches for the brand name itself (three searches a week,
# reused for 7 days). Add competitors and topics below to widen it. Each competitor and topic
# becomes a few searches, so a short list goes a long way on free credits.

competitors: []
#  - name: Example Brand
#    domain: example.com

topics: []
#  - overalls outfit ideas

# Searches you want exactly as written. kind is web or news; recency is day, week, month or year.
queries: []
#  - q: "sweatpants overalls trend"
#    kind: news
#    recency: month

auto:
  brand: true
  competitors: true
  topics: true

# ---- ads, social and deep research (collected by Actions > Collect, using a real browser) ---------
# Nothing here runs unless you tick it in Collect. Each run is capped (see research.yaml).
ads:                         # Meta Ad Library, public pages, no login
  country: us
  status: active
  keywords:                  # each word is searched in the Ad Library; ads from rivals AND copycats show up
    - sweatpant overalls
    - swoveralls
    - jogger overalls
    - fleece overalls
    - overall sweatpants
  # pages:                   # once Collect shows you the rival advertisers, paste their Ad Library links here
  #   - https://www.facebook.com/ads/library/?active_status=all&ad_type=all&country=US&view_all_page_id=PAGE_ID_HERE
social:
  tiktok:                    # needs TIKTOK_COOKIES; run mode recon first to prove the page can be read
    hashtags: [swoveralls, sweatpantoveralls]
    profiles: [swoveralls]
  instagram:                 # needs INSTAGRAM_COOKIES; run mode recon first
    hashtags: [swoveralls, sweatpantoveralls]
deep_research:               # only runs when you tick Gemini Deep Research; each report takes 10+ minutes
  context: >
    Swoveralls sells sweatpant overalls (fleece, cotton/polyester/spandex) with 6-7 pockets. Core solid colours
    are $99, limited-edition prints $120, Comfyalls $149-159, kids $44-49, shorts $89. Collaborations include
    Yo Gabba Gabba and NASA. Audience: adults who want comfortable, funny, giftable loungewear; a kids line exists.
  questions:
    - Who are the main competitors to Swoveralls in comfortable overalls and loungewear in the US, and which ad angles and hooks do their Meta and TikTok ads use? Give examples with links.
