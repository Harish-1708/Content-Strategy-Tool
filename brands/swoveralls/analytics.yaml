# The store's own numbers, read only (Google Analytics 4 and Search Console), and the keywords whose public ranking is checked through Serper.
# Fill these in when the store owner has added the tool's Google service account (the client_email inside GOOGLE_SERVICE_ACCOUNT_JSON) as a Viewer on the GA4 property
# and as a user on the Search Console property. Until then every skill that needs these numbers stays on NEEDS_INPUT: nothing is estimated or invented.
ga4_property_id:            # the numeric property id for THIS brand's store, for example 123456789 (GA4 > Admin > Property settings)
search_console_site:        # exactly as Search Console writes it for this brand, for example sc-domain:swoveralls.com or https://www.swoveralls.com/
domain: ""                  # this brand's own domain for the public Serper rank checks (no access needed), for example swoveralls.com
rank_keywords: []           # keywords whose public ranking is checked for this brand, for example [sweatpant overalls, bib overalls]
