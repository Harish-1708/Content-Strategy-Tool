# What to research for Defi Snacks. Edit this file in GitHub; every research run reads it.
#
# Out of the box the tool only searches for the brand name itself (three searches a week,
# reused for 7 days). Add competitors and topics below to widen it. Each competitor and topic
# becomes a few searches, so a short list goes a long way on free credits.

competitors: []
#  - name: Example Brand
#    domain: example.com

topics: []
#  - overalls outfit ideas

# Searches you want exactly as written. kind is web or news; recency is day, week, month or year.
queries: []
#  - q: "sweatpants overalls trend"
#    kind: news
#    recency: month

auto:
  brand: true
  competitors: true
  topics: true

# ---- ads, social and deep research (collected by Actions > Collect, using a real browser) -------------------------
# Nothing is collected until you add seeds below. Remove the # marks to switch an example on.
# ads:
#   country: us            # two-letter code
#   status: active         # all, active or inactive
#   pages:                 # best: an Ad Library link for the advertiser (copy it from the browser);
#                          # a plain Facebook page address is searched for by the page's name
#     - https://www.facebook.com/ads/library/?active_status=all&ad_type=all&country=US&view_all_page_id=1234567890
#   keywords:              # words to search the Ad Library for
#     - sweatpant overalls
# social:
#   tiktok:
#     hashtags: [overalls]
#     profiles: []
#     searches: []
#   instagram:
#     hashtags: [overalls]
# deep_research:           # each question is one Gemini Deep Research report (10+ minutes)
#   context: >             # optional: what Claude may tell Gemini if it asks (product, audience, goal)
#     Swoveralls makes sweatpant overalls for young adults. We want ad angles that are not yet saturated.
#   questions:
#     - Who are the main competitors in comfortable loungewear overalls, and what angles do their ads use?
