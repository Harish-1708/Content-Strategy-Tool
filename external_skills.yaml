# The Aaron marketing skills, connected EXTERNALLY (Batch 2): the whole repository is checked out at a pinned commit and read at run time; nothing is copied or rebuilt here,
# so a skill is never stale, and a change upstream shows up in the update report before anything adopts it.
#
# Skill text is DATA: it is read, hashed and handed to the model as a method to apply to the brand's own inputs. It never runs as a command of this tool, and the
# repository's scripts are not run by this stage.
repo:
  url: https://github.com/aaron-he-zhu/aaron-marketing-skills
  pinned_commit: 7932adf5176a9a3ba0e8995be0b3bdee97a330ff      # the commit this catalogue was built from (2026-11-16); change it only after reading the update report
  checkout_path: external/aaron-marketing-skills   # where the workflows check it out (git-ignored); the AARON_SKILLS_DIR variable overrides it
  licence: Apache-2.0       # recorded, never used to cut scope: the tool is a personal, non-commercial project
  expected_skills: 120
  max_skill_chars: 60000    # a skill text longer than this is cut and says so
# Files the skills' auditors and registries need at run time (without them an auditor returns NOT_SCORED): the whole repository is checked out, these are verified present.
runtime_files:
  - scripts/rubric-score.py
  - scripts/validate-audit-artifact.py
  - scripts/registry-events.py
  - scripts/connectors/experiment.py
  - references/auditor-runbook.md
# state: ready = can run on public data and the brand's own inputs now; waiting_for_access = built ready, paused until the stores' own numbers (GA4, Search Console, customer or
# platform exports) exist: it stays on NEEDS_INPUT and never invents a number. auto_run: false = reachable on request, never started by a schedule or a chain (the 21 the report
# judged not useful for this tool; cold-outbound-sequencer carries routes_to: the separate email outreach tool, and never starts here). needs: says what a waiting skill is waiting for.
