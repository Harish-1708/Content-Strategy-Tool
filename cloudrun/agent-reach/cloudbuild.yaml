# Cloud Build: builds the image from the repository root and stores it in Artifact Registry.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "cloudrun/agent-reach/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
substitutions:
  _IMAGE: us-docker.pkg.dev/PROJECT/agent-reach/agent-reach:latest
options:
  logging: CLOUD_LOGGING_ONLY
