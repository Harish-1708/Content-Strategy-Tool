    description: "Storyboards (numbered shots with visual, words, duration and assets) for each concept of the latest READY brief. RANKING NOT YET MEASURED: seeded as a rotation of the whole pool, so every provider takes a turn leading some job; the retest measures it and replaces the seed."
    max_data_class: internal
    chain:
      - {provider: bazaarlink, model: bazaarlink/auto:free}
      - {provider: cloudflare, model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"}
      - {provider: groq, model: openai/gpt-oss-120b}
      - {provider: aihorde, model: aihorde/any}
      - {provider: cohere, model: command-a-reasoning-08-2025}
      - {provider: google, model: gemini-3.5-flash}
      - {provider: nvidia, model: google/gemma-4-31b-it}
      - {provider: openrouter, model: openrouter/free}
      - {provider: zhipu, model: glm-4.7-flash}
      - {provider: kilo, model: kilo-auto/free}
      - {provider: ovh, model: Mistral-Small-3.2-24B-Instruct-2506}
      - {provider: xkiro, model: xkiro/mistralai/mistral-large-2512}
      - {provider: llm7, model: llm7/glm-5.3-flash}
      - {provider: anyapi, model: "qwen/qwen3.8-27b:free"}
      - {provider: requesty, model: "requesty/google/gemma-4-31b-it"}
      - {provider: navy, model: navy/shared-pool}
      - {provider: pollinations, model: pollinations/openai-fast}
    claude_fallback: false      # the module falls back to its own Claude client, under its own spending cap, when this lane (and the shared pool after it) has no answer
    output: {format: json, schema: {type: object}}
    max_tokens: 8000

