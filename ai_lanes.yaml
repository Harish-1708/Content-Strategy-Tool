    description: "Checking one claim from public sources: make search queries, and say whether one page supports or contradicts the claim with an exact quotation. RANKING NOT YET MEASURED: seeded from the measured leaders of the existing jobs (the 2026-11-18 pool retest); the pool retest measures this job's own list."
