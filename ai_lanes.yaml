# AI task lanes: the kinds of work, and for each a fixed chain of routes tried in order.
#
# A route is {provider, model}; the model must be on the approved allowlist in ai_providers.yaml. A route is used only if its
# provider is enabled and approved for the data class of the task; otherwise it is skipped and the next one is tried. If no route
# answers and claude_fallback is true, Claude answers (counted against the spending cap); if Claude cannot either, the task is
# deferred. Nothing is guessed and nothing silently becomes paid.
#
# max_data_class: the most sensitive data this lane may carry. claude_leads: Claude is first (strategy, briefs). review: required
# means every output waits for a person in the review queue. forbid: phrases an output must never contain.
version: 1
lanes:
  research_extraction:
    description: Pull structured facts out of collected public pages, ads and search results.
    max_data_class: internal
    chain:
      - {provider: groq, model: openai/gpt-oss-120b}
      - {provider: mistral, model: mistral-small-latest}
      - {provider: openrouter, model: "nvidia/nemotron-3-super-120b-a12b:free"}
      - {provider: openrouter, model: "qwen/qwen3-next-80b-a3b-instruct:free"}
      - {provider: github, model: openai/gpt-4.1-mini}
      - {provider: cloudflare, model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"}
    claude_fallback: true
    output: {format: json, schema: {type: object, required: [items], properties: {items: {type: array, minItems: 1}}}}
    max_tokens: 1500

  competitor_intelligence:
    description: Classify and summarise competitor activity (products, offers, messaging).
    max_data_class: internal
    chain:
      - {provider: groq, model: openai/gpt-oss-120b}
      - {provider: mistral, model: mistral-small-latest}
      - {provider: github, model: openai/gpt-4.1-mini}
      - {provider: cloudflare, model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"}
    claude_fallback: true
    output: {format: json, schema: {type: object, required: [competitors], properties: {competitors: {type: array}}}}
    review: required
    max_tokens: 1500

  audience_voice:
    description: Group audience questions and complaints into pain-point themes, keeping the source of every quote.
    max_data_class: internal
    chain:
      - {provider: mistral, model: mistral-small-latest}
      - {provider: groq, model: openai/gpt-oss-120b}
      - {provider: github, model: openai/gpt-4.1-mini}
      - {provider: cloudflare, model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"}
    claude_fallback: true
    output: {format: json, schema: {type: object, required: [themes], properties: {themes: {type: array, minItems: 1}}}}
    review_sample_every: 5
    max_tokens: 1500

  formula_analysis:
    description: Match a creative to a known formula or describe a new one, with a confidence.
    max_data_class: internal
    chain:
      - {provider: groq, model: openai/gpt-oss-120b}
      - {provider: mistral, model: mistral-large-latest}
      - {provider: github, model: openai/gpt-4.1-mini}
      - {provider: cloudflare, model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"}
    claude_fallback: true
    output: {format: json, schema: {type: object, required: [formula, confidence], properties: {formula: {type: string, minLength: 2}, confidence: {type: number, minimum: 0, maximum: 1}}}}
    min_confidence: 0.4
    max_tokens: 800

  trend_opportunity:
    description: Spot rising angles and gaps from collected evidence, with the evidence cited.
    max_data_class: internal
    chain:
      - {provider: mistral, model: mistral-large-latest}
      - {provider: groq, model: openai/gpt-oss-120b}
      - {provider: github, model: openai/gpt-4.1-mini}
      - {provider: cloudflare, model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"}
    claude_fallback: true
    output: {format: json, schema: {type: object, required: [opportunities], properties: {opportunities: {type: array, minItems: 1}}}}
    review: required
    max_tokens: 2000

  strategic_reasoning:
    description: Weigh options and recommend a direction. Claude leads; a person reviews.
    max_data_class: restricted
    chain:
      - {provider: claude, model: claude-sonnet-5-5}
    claude_leads: true
    output: {format: text, min_chars: 200}
    forbid: [guaranteed results, clinically proven, 100% safe]
    review: required
    max_tokens: 2500

  content_ideation:
    description: Propose hooks and angles for a brand, from approved evidence and facts.
    max_data_class: internal
    chain:
      - {provider: mistral, model: mistral-large-latest}
      - {provider: groq, model: openai/gpt-oss-120b}
      - {provider: google, model: gemini-3.5-flash}
      - {provider: github, model: openai/gpt-4.1-mini}
      - {provider: cloudflare, model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"}
    claude_fallback: true
    output: {format: json, schema: {type: object, required: [ideas], properties: {ideas: {type: array, minItems: 3}}}}
    forbid: [guaranteed results, clinically proven, 100% safe]
    review_sample_every: 5
    max_tokens: 1800

  brief_generation:
    description: Write a creative brief. Claude leads; every brief waits for a person and passes the claim check.
    max_data_class: restricted
    chain:
      - {provider: claude, model: claude-sonnet-5-5}
    claude_leads: true
    output: {format: json, schema: {type: object, required: [title, hook, body], properties: {title: {type: string, minLength: 3}, hook: {type: string, minLength: 5}, body: {type: string, minLength: 50}}}}
    forbid: [guaranteed results, clinically proven, 100% safe]
    review: required
    max_tokens: 3000

  production_support:
    description: Shot lists, captions and on-screen text drafts for the studio.
    max_data_class: internal
    chain:
      - {provider: groq, model: openai/gpt-oss-20b}
      - {provider: mistral, model: mistral-small-latest}
      - {provider: github, model: openai/gpt-4.1-mini}
      - {provider: cloudflare, model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"}
    claude_fallback: true
    output: {format: text, min_chars: 40}
    review_sample_every: 5
    max_tokens: 1500

  validation_qa:
    description: Check another output against the evidence and the rules; list real problems only.
    max_data_class: restricted
    chain:
      - {provider: claude, model: claude-haiku-5-5}
    claude_leads: true
    output: {format: json, schema: {type: object, required: [verdict, issues], properties: {verdict: {type: string, enum: [pass, fail, unsure]}, issues: {type: array}}}}
    max_tokens: 1200

  # The two lanes the platform's modules reach through the AI Gateway adapter (services.ai_client) when the owner routes a purpose gateway_first. They carry Internal data at most and need no review:
  # the module's own checks (claims, schemas, rules) still run on whatever comes back, exactly as they do on Claude's answer.
  general_text:
    description: Plain-text language-model task for any module (seed words and the like), when routed through the gateway.
    max_data_class: internal
    chain:
      - {provider: groq, model: openai/gpt-oss-120b}
      - {provider: mistral, model: mistral-small-latest}
      - {provider: openrouter, model: "nvidia/nemotron-3-super-120b-a12b:free"}
      - {provider: openrouter, model: "qwen/qwen3-next-80b-a3b-instruct:free"}
      - {provider: github, model: openai/gpt-4.1-mini}
      - {provider: cloudflare, model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"}
    claude_fallback: false      # the module that asked falls back to its own Claude client, under its own spending cap, when this lane has no answer
    output: {format: text, min_chars: 1}
    max_tokens: 2000

  general_json:
    description: JSON language-model task for any module (idea scoring, planning, briefs, deep checks), when routed through the gateway.
    max_data_class: internal
    chain:
      - {provider: groq, model: openai/gpt-oss-120b}
      - {provider: mistral, model: mistral-small-latest}
      - {provider: openrouter, model: "nvidia/nemotron-3-super-120b-a12b:free"}
      - {provider: openrouter, model: "qwen/qwen3-next-80b-a3b-instruct:free"}
      - {provider: github, model: openai/gpt-4.1-mini}
      - {provider: cloudflare, model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"}
    claude_fallback: false      # the module that asked falls back to its own Claude client, under its own spending cap, when this lane has no answer
    output: {format: json, schema: {type: object}}
    max_tokens: 2500
