# THE SHARED POOL: every approved model, in one list, available to every lane (after the lane's own preferred routes above), and to every future stage, tool and the website, without
# any of them needing its own wiring. A model is approved once in ai_providers.yaml and listed once here; it is not the property of any lane. A route is still used only if its provider
# is enabled and approved for the data class, has a credential and is not resting, and is paced to the provider's own limits. The proven providers come first, then the new ones. Lanes that
# must stay with Claude (strategic reasoning, brief generation, validation) say use_pool: false. Which models a free tier really serves is shown by `ai check`; take one out by removing its line.

