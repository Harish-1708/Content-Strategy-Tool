# Settings for the competitor observatory, the YouTube corpus and the public readers. Every value here is the default, written out so you can see it and change it in GitHub.
# A mistake in this file stops the run with a message naming the key; nothing is guessed. Per-brand competitors go in brands/<brand>/observatory.yaml (see docs/observatory/README.md).
version: 1

# How the tool behaves toward other people's websites. The contact address is NOT written here: set the OBSERVATORY_CONTACT secret.
politeness:
  min_delay_seconds: 5          # pause between requests to one site; doubles after a block, up to max_delay_seconds
  max_delay_seconds: 60
  max_requests_per_domain: 80   # a hard ceiling per site per run
  cache_minutes: 360

# These crawl_policy settings apply only while the robots_txt guard is ON (services.guards.channels.robots_txt; OFF by default, so robots.txt is not consulted). robots.txt is a crawler preference, not an access control. When the guard is ON, for the tool's own crawler the default is to obey it.
# is to read and say that robots.txt asked otherwise. Either can be changed; an exception always names who decided and why.
crawl_policy:
  robots: obey                  # obey, or advisory (advisory needs a written basis below)
  reader_robots: advisory       # obey or advisory, for Jina Reader
  basis: "Owner decision (Harish, 2026-11-03): public pages may be read through Jina Reader for research; a robots.txt exclusion is noted in the report, never hidden"
  overrides: []                 # per site, for example:
  # - {host: example.com, robots: obey, basis: owner_decision, approved_by: Harish, date: "2026-11-03", note: "asked us to stay away"}

advanced:
  proxies: []                   # names only (for example eu1); the address is the secret OBSERVATORY_PROXY_EU1
  rotate: none

# The owner's switches for each kind of request control. Every one is on by default; turn one off and a competitor that asks for it is refused with a message, never quietly changed.
# The controls themselves are chosen per competitor in brands/<brand>/observatory.yaml under advanced:, for any website, with no list of hosts and no approval step:
#   custom_identity: identity, headers, accept_language       proxy: proxy, rotate               session: session
#   browser: browser/stealth, locale, timezone, wait_selector account_cookies: cookies_env        evasion: impersonate, hide_canvas, block_webrtc, humanize, solve_challenges
# Refusals: with the rest guard OFF (the default) a refusing site is retried a few times (see retry: below) and then marked failed; with it ON the host rests and nothing retries it. Run `observatory controls` to see what is on. See docs/observatory/README.md.
access_controls:
  custom_identity: true
  proxy: true
  session: true
  browser: true
  account_cookies: true
  evasion: true

# Shared services for the whole platform: Scrapling, Agent-Reach, web search, the AI Gateway and the page readers. Every module asks them with a purpose, and you control them here, in the Controls tab of any
# brand sheet, or with `observatory controls`. These are the initial defaults: everything supported is ON for every purpose and channel, the AI Gateway is tried first (Claude when no free provider can answer) and pages are read with auto (Scrapling, then Jina, then the built-in reader). Turn any single service, purpose or channel off, or choose another route, whenever you like.
# use_for switches a service on or off for one kind of work. Scrapling's defaults/overrides set request options centrally (overrides match a site such as *.example.com, or purpose:discovery);
# a competitor's own advanced: block still wins. routes pick the engine that reads pages for a purpose (jina, core, scrapling, auto) and whether a purpose's language-model calls try the AI Gateway first
# (claude, or gateway_first). See
services:
  scrapling:
    enabled: true
    use_for: {competitors: true, discovery: true, social_discovery: true, content_research: true, youtube_research: true, general_research: true, idea_bank: true, planning: true, brief: true, deep_check: true, autoseeds: true, collectors: true}
    defaults: {browser: true, session: true, proxy: true, impersonate: true, hide_canvas: true, block_webrtc: true, humanize: true, solve_challenges: true, disable_resources: true}     # all on; set one to false to turn it off. Also e.g. identity: "Kelson-Research/2.0", locale: en-GB
    overrides: []                # e.g. - {match: "*.example.com", delay: 30}   or   - {match: "purpose:discovery", humanize: true}
  agent_reach:
    enabled: true
    use_for: {competitors: true, discovery: true, social_discovery: true, content_research: true, youtube_research: true, general_research: true, idea_bank: true, planning: true, brief: true, deep_check: true, autoseeds: true, collectors: true}
    channels: {instagram: true, reddit: true, youtube: true}
  search:
    enabled: true
    use_for: {competitors: true, discovery: true, social_discovery: true, content_research: true, youtube_research: true, general_research: true, idea_bank: true, planning: true, brief: true, deep_check: true, autoseeds: true, collectors: true}
    channels: {serper_dev: true, tavily: true, serpapi: true, exa: true, exa_mcp: true, agent_reach_reddit: true, agent_reach_youtube: true}
  ai_gateway:
    enabled: true
    use_for: {competitors: true, discovery: true, social_discovery: true, content_research: true, youtube_research: true, general_research: true, idea_bank: true, planning: true, brief: true, deep_check: true, autoseeds: true, collectors: true}
    routes: {general_research: gateway_first, idea_bank: gateway_first, planning: gateway_first, brief: gateway_first, deep_check: gateway_first, autoseeds: gateway_first, collectors: gateway_first}
  page_readers:
    enabled: true
    use_for: {competitors: true, discovery: true, social_discovery: true, content_research: true, youtube_research: true, general_research: true, idea_bank: true, planning: true, brief: true, deep_check: true, autoseeds: true, collectors: true}
    routes: {competitors: auto, discovery: auto, social_discovery: auto, content_research: auto, youtube_research: auto, general_research: auto, idea_bank: auto, planning: auto, brief: auto, deep_check: auto, autoseeds: auto, collectors: auto}

engine:
  pages: core                   # the older single switch: scrapling makes Scrapling the only reader for competitor and discovery pages while their route is auto (page_readers routes above are the full control)

readers:
  jina: true
  exa: true
  jina_per_minute: 15           # Jina's free limit without a key is 20 a minute

discovery:
  enabled: true
  min_score: 40
  auto_monitor_score: 65        # at or above this a competitor is monitored automatically
  auto_monitor_max: 6           # at most this many are added automatically
  max_monitored: 10             # at most this many competitors are monitored per brand in total
  enrich: true                  # find each strong candidate's Instagram account (and website) from several sources, with a confidence
  enrich_max: 8                 # candidates enriched per run
  min_confidence: 0.7           # a match below this is kept as a "possible", not written to the competitor record
  agent_reach_calls: 12         # Instagram account searches and profile reads through OpenCLI per run (it runs only on a machine you control)
  judge: true                   # ask the AI for a second opinion on each candidate; every verdict waits for your review
  judge_max: 16                 # candidates judged per run

retry:                          # with the rest guard OFF (the default): how many times a refusing site is tried before it is marked failed and the run moves on
  attempts: 3                   # 1 to 10
  backoff_seconds: 2            # 0 to 60; the pause grows with each try

crawl:                          # a polite site crawl through Scrapling (corpus --what crawl; any module through SV.scrapling_crawl)
  max_pages: 25                 # pages at most, 1 to 200
  depth: 2                      # links deep at most, 0 to 6; it stays on the start site and stops at the first block or rate limit

youtube:
  daily_unit_cap: 3000          # the tool's own ceiling, well under YouTube's free 10,000 a day
  max_channels: 25
  videos_per_channel: 50
  search_calls_per_run: 2       # each channel search costs 100 units
