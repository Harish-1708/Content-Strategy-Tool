# What each source is, how the tool reaches it, and what it can and cannot give.
#
# This file DECLARES; it proves nothing. A source counts as working (healthy) only after a live
# acceptance run has passed on GitHub: Actions > Acceptance > Run workflow. Until then the Collector
# Health tab shows it as "unverified", and nothing that scores or ranks is allowed to depend on it.
#
# tier (how the data is reached):
#   official_api         a documented programme or API
#   public_polite        a public page or feed, read politely (robots.txt, throttle, honest user agent)
#   session_based        a dummy account's saved login (cookies)
#   third_party_service  a paid or free service that does the collecting (Apify, a search API)
#   licensed_vendor      a data vendor whose terms cover the use
#   human_assisted       a person captured it
# access_type (what comes back, so a snippet is never mistaken for a page, nor a cover picture for a video):
#   site_data  the site's own structured data     page_links  only links found on a page
#   page_text  the text of a page                  search_snippet  a search result's short extract
#   report_text  a written report                  media_file  a downloaded picture or video
#   model_output  an AI model's answer             feed  a catalogue or news feed
# status: established (in use), experimental (to be proven; off unless enabled), planned (not built yet)
#
# A route with "enabled: false" never runs. Changing a route's entry changes its route hash, and a
# changed route has to pass acceptance again before it is trusted.

version: 1

defaults:
  stale_after_days: 14            # data older than this is labelled stale
  acceptance_max_age_days: 14     # a pass older than this no longer counts
  window_days: 7                  # the success rate looks at this many days
  degrade_after_failures: 3       # failures in a row before a route is called degraded
  recover_after_successes: 2      # successes in a row before it is healthy again (stops flapping)
  history_cap: 200                # attempts remembered per route
  pause_seconds:                  # how long a route rests after each kind of failure
    RATE_LIMITED: 3600
    TIMEOUT: 60
    UPSTREAM_BROKEN: 120
    NEED_SETUP: 60
    NEED_LOGIN: 43200
    PLATFORM_BLOCKED: 86400

sources:
  meta_ads:
    kind: collector
    label: Meta Ad Library
    platform: meta
    status: established
    capabilities: [ad text, advertiser page, start date, days running, variant count]
    limitations:
      - no view counts, so days running and variant count are used as labelled proxies
      - public pages are read; a complete list of an advertiser's ads is not guaranteed
    routes:
      browser: {tier: public_polite, access_type: site_data, login: none}
      apify: {tier: third_party_service, access_type: site_data, login: none}

  tiktok:
    kind: collector
    label: TikTok
    platform: tiktok
    status: established
    capabilities: [posts, captions, engagement counts, cover pictures]
    limitations:
      - GitHub's servers have been refused video downloads, so many items are cover picture only
      - a dummy account can be warned
    routes:
      browser: {tier: session_based, access_type: site_data, login: dummy_account}
      apify: {tier: third_party_service, access_type: site_data, login: none}

  instagram:
    kind: collector
    label: Instagram
    platform: instagram
    status: established
    capabilities: [posts, captions, engagement counts, cover pictures]
    limitations:
      - a dummy account can be warned
      - posts only; no private analytics
      - the Agent-Reach route needs OpenCLI and a logged-in browser on a machine you control, and is not live-verified
    routes:
      browser: {tier: session_based, access_type: site_data, login: dummy_account}
      apify: {tier: third_party_service, access_type: site_data, login: none}
      agent_reach:
        tier: session_based
        access_type: site_data
        login: dummy_account
        experimental: true
        note: >-
          Agent-Reach's Instagram route reads through OpenCLI in a browser a person has logged in to, and its authors mark it experimental.
          It runs beside the existing route (observatory instagram collect), merges with it without overwriting it, and is judged against it on
          unique usable items, completeness and failure rate (observatory instagram compare). It needs OpenCLI and a logged-in browser on a machine
          you control and never runs on a GitHub-hosted runner, so no Instagram cookie or password is ever given to one.

  deep_research:
    kind: collector
    label: Gemini Deep Research
    platform: gemini
    status: established
    capabilities: [long written reports with sources]
    limitations:
      - runs in the Gemini web app with a dummy account; a report takes 10 minutes or more
    routes:
      browser: {tier: session_based, access_type: report_text, login: dummy_account}

  web_search:
    kind: search
    label: Web and news search services
    platform: web
    status: established
    capabilities: [search results, news results]
    limitations:
      - a result is a short snippet, never the page; it is labelled search_snippet
    routes:
      serper_dev: {tier: third_party_service, access_type: search_snippet, login: api_key}
      tavily: {tier: third_party_service, access_type: search_snippet, login: api_key}
      serpapi: {tier: third_party_service, access_type: search_snippet, login: api_key}
      exa: {tier: third_party_service, access_type: search_snippet, login: api_key}
      exa_mcp: {tier: third_party_service, access_type: search_snippet, login: none}
      agent_reach_reddit: {tier: session_based, access_type: search_snippet, login: dummy_account, experimental: true, note: "Reddit search through Agent-Reach (OpenCLI); on in the workflows (AGENT_REACH_SEARCH=on) but only runs where OpenCLI and a logged-in browser are, never on a hosted runner"}
      agent_reach_youtube: {tier: third_party_service, access_type: search_snippet, login: none, experimental: true, note: "YouTube search through Agent-Reach (yt-dlp, no login); on in the workflows (AGENT_REACH_SEARCH=on), last in the web search order"}

  shopify_catalogue:
    kind: catalogue
    label: Brand catalogue (public Shopify feed)
    platform: shopify
    status: established
    stale_after_days: 3
    capabilities: [products, variants, prices, stock]
    limitations:
      - only what the shop publishes; unpublished products are invisible
    routes:
      public_json: {tier: public_polite, access_type: feed, login: none}

  video_tiktok:
    kind: video
    label: TikTok video downloads
    platform: tiktok
    status: established
    capabilities: [video file for Idea Bank items]
    limitations:
      - the platform often refuses GitHub's servers; the item then keeps its cover picture and says so
    routes:
      layered: {tier: session_based, access_type: media_file, login: dummy_account}

  video_instagram:
    kind: video
    label: Instagram video downloads
    platform: instagram
    status: established
    capabilities: [video file for Idea Bank items]
    limitations:
      - the platform often refuses GitHub's servers; the item then keeps its cover picture and says so
    routes:
      layered: {tier: session_based, access_type: media_file, login: dummy_account}

  youtube_public:
    kind: collector
    label: YouTube public videos
    platform: youtube
    status: experimental
    capabilities: [video details, public view and like counts, channel uploads]
    limitations:
      - official API with a free key; the free quota is 10,000 units a day (a video lookup costs 1, a search costs 100)
      - public details and counts only; never a channel's private analytics
      - captions and transcripts of other people's videos are not available this way
    routes:
      data_api: {tier: official_api, access_type: site_data, login: api_key}
      yt_dlp:
        tier: public_polite
        access_type: site_data
        login: none
        enabled: false
        experimental: true
        note: >-
          Switched off. On 2026-11-03 the first live acceptance run from GitHub's servers was refused with "Sign in to confirm
          you're not a bot" (YouTube treats data-centre addresses as bots). The only workaround is logged-in cookies, which this
          tool does not use for YouTube. Use data_api instead.

  claude:
    kind: ai
    label: Claude
    platform: anthropic
    status: established
    stale_after_days: 3
    capabilities: [text, picture review]
    limitations:
      - metered; every call is counted against the monthly cap
    routes:
      api: {tier: official_api, access_type: model_output, login: api_key}

  reddit_public:
    kind: collector
    label: Reddit and community discussions
    platform: reddit
    status: planned
    capabilities: [public discussions]
    limitations:
      - built in Stage 3; public search and permitted public pages only
    routes:
      public_web: {tier: public_polite, access_type: page_text, login: none}

  reddit:
    kind: collector
    label: Reddit posts (official API and Agent-Reach)
    platform: reddit
    status: experimental
    capabilities: [posts, scores, comment counts, communities]
    limitations:
      - the official API route runs only with a recorded approval from Reddit (free is non-commercial only; commercial needs a contract) and is not live-verified
      - the Agent-Reach route needs OpenCLI and a logged-in browser on a machine you control, never a hosted runner, and is not live-verified
      - posts only; comment threads are not read
    routes:
      api: {tier: official_api, access_type: site_data, login: api_key}
      agent_reach:
        tier: session_based
        access_type: site_data
        login: dummy_account
        experimental: true
        note: >-
          Reddit through OpenCLI in a browser a person has logged in to; complements the official API route and fills its gaps without overwriting it.

  agent_reach_research:
    kind: collector
    label: Agent-Reach research (search, read and profiles across its channels)
    platform: web
    status: experimental
    capabilities: [search results, pages and posts, profiles, subtitles, repositories, job postings]
    limitations:
      - Instagram, Reddit, X (Twitter), Facebook, LinkedIn, Xiaohongshu and Boss need OpenCLI and a browser logged in to the site, on a machine you control, never a hosted runner
      - YouTube runs on yt-dlp with no login; YouTube may bot-check data-centre addresses (reported, not worked around)
      - GitHub uses the public REST API with no login (60 requests an hour; GITHUB_TOKEN raises it)
      - not live-verified; OpenCLI's output field names are read through generic mappings
    routes:
      youtube:
        tier: third_party_service
        access_type: site_data
        login: none
        experimental: true
        note: >-
          YouTube searches, pages and subtitles through yt-dlp (Agent-Reach's YouTube implementation); complements the official YouTube Data API route, which stays the main one.
      github:
        tier: official_api
        access_type: site_data
        login: none
        experimental: true
        note: >-
          Repository search, README and issue reading through GitHub's public REST API.
      web:
        tier: third_party_service
        access_type: page_text
        login: none
        experimental: true
        note: >-
          Pages read through the platform's shared page readers (Scrapling, Jina Reader, built-in); recorded under the reader's own routes.
      instagram:
        tier: session_based
        access_type: site_data
        login: dummy_account
        experimental: true
        note: >-
          Instagram searches, profiles and posts through OpenCLI in a logged-in browser on a machine you control.
      reddit:
        tier: session_based
        access_type: site_data
        login: dummy_account
        experimental: true
        note: >-
          Reddit searches, posts and subreddits through OpenCLI in a logged-in browser on a machine you control.
      twitter:
        tier: session_based
        access_type: site_data
        login: dummy_account
        experimental: true
        note: >-
          X (Twitter) searches, profiles, posts and threads through OpenCLI in a logged-in browser on a machine you control.
      facebook:
        tier: session_based
        access_type: site_data
        login: dummy_account
        experimental: true
        note: >-
          Facebook searches and profiles through OpenCLI in a logged-in browser on a machine you control.
      linkedin:
        tier: session_based
        access_type: site_data
        login: dummy_account
        experimental: true
        note: >-
          LinkedIn job postings through OpenCLI in a logged-in browser on a machine you control.
      xiaohongshu:
        tier: session_based
        access_type: site_data
        login: dummy_account
        experimental: true
        note: >-
          Xiaohongshu searches and notes through OpenCLI in a logged-in browser on a machine you control.
      boss:
        tier: session_based
        access_type: site_data
        login: dummy_account
        experimental: true
        note: >-
          Boss job searches through OpenCLI in a logged-in browser on a machine you control.

  competitor_stores:
    kind: collector
    label: Competitor stores (public product data and sitemaps)
    platform: shopify
    status: experimental
    capabilities: [products, prices and compare-at prices, stock, every collection a product sits in with its position, sitemap dates, change events]
    limitations:
      - reads only what a store publishes openly (meta.json, products.json, collections.json and its sitemaps); robots.txt is always obeyed
      - a store may switch these files off; that is reported, never worked around
      - the best-seller order is available only where the store honours the sort option (tested per store)
    routes:
      public_json: {tier: public_polite, access_type: feed, login: none}
      sitemap: {tier: public_polite, access_type: feed, login: none}

  competitor_pages:
    kind: collector
    label: Competitor pages, blogs and feeds
    platform: web
    status: experimental
    capabilities: [page text, headlines, announcement bars, offers, blog and product feeds]
    limitations:
      - robots.txt is always obeyed; a page that needs a login or shows a bot check is reported, not worked around
      - page text is cleaned of hidden and invisible content before anything else reads it
    routes:
      static_fetch: {tier: public_polite, access_type: page_text, login: none}
      feed: {tier: public_polite, access_type: feed, login: none}
      reader: {tier: third_party_service, access_type: page_text, login: none}
      social_profile: {tier: public_polite, access_type: page_text, login: none}

