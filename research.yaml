# How research credits may be spent. Edit this file in GitHub; every research run reads it.
# Numbers are credits (one ordinary search = 1 credit), not dollars.
#
# What each provider's free plan gives (checked October 2026; plans change, so re-check):
#   Serper.dev  2,500 free searches when you sign up. A one-time pool, not monthly.
#   Tavily      1,000 free credits every month. Basic search 1 credit, advanced search 2.
#   SerpApi     a small free monthly plan (its changelog says 250; some pages still say 100).
#
# The tool counts every credit it spends (data/_shared/research_usage.json), and for Tavily and
# SerpApi it also asks the provider how many are really left, so it never overspends.
providers:
  serper_dev:
    monthly_cap: 250        # at this pace the free pool lasts about ten months
    lifetime_cap: 2400      # keeps a little back
  tavily:
    monthly_cap: 600
    keep_free: 50           # never go below 50 left on Tavily's own count
  serpapi:
    monthly_cap: 100
    keep_free: 20

# The first provider in each list that still has credits takes the search; the next one is the
# fallback. News searches go to Tavily first because it renews monthly and dates its results.
routing:
  web: [serper_dev, tavily, serpapi]
  news: [tavily, serper_dev, serpapi]

defaults:
  results_per_query: 10     # 1 to 10; more results never cost more credits here
  cache_days: 7             # a search made in the last 7 days is reused, not paid for again
  max_queries_per_run: 30   # a safety limit for one run
  country: us               # two-letter code
  recency:                  # day, week, month or year; blank means any time
  compare_queries: 5        # compare mode runs this many searches on EVERY ticked service

# ---- collectors: competitor ads, TikTok, Instagram and Gemini Deep Research -----------------------
# These drive a real browser (see browser.yaml): Meta Ad Library's public pages with no login,
# Instagram and TikTok as a dummy account, and Gemini Deep Research in the Gemini web app as a dummy
# Google account (a report takes 10+ minutes). The caps keep every run small and gentle.
collectors:
  browser:
    monthly_items: 400      # most ads/posts collected per calendar month, across all brands (it was 150 before
                            # benchmark brands were followed by page; lower it here if you want a tighter ceiling)
    items_per_run: 30       # most ads/posts collected in one run
    cache_days: 3           # the same seeds are not collected again inside this many days
  gemini:
    monthly_tasks: 2        # most Deep Research reports per month (each uses the account's own daily quota)
    tasks_per_run: 1        # most Deep Research reports in one run
    cache_days: 14
  # Apify: ready-made scrapers on Apify's servers, an OPTIONAL extra for ads, TikTok and Instagram.
  # It is off. Its free plan includes a small monthly credit; every result is charged.
  #   mode: off       never used (the default)
  #   mode: fallback  used only when the browser route fails (expired cookies, a security check, nothing readable)
  #   mode: always    used instead of the browser
  # The Collect workflow's "backend" box can also switch it on for one run. Needs the APIFY_TOKEN secret.
  apify:
    mode: off
    monthly_items: 100
    items_per_run: 30
    max_cost_per_run_usd: 1.0     # a hard dollar ceiling Apify enforces for a single run
    actors:                       # swap a scraper for another here without touching any code
      meta_ads: apify/facebook-ads-scraper
      tiktok: clockworks/tiktok-scraper
      instagram: apify/instagram-hashtag-scraper
  # Claude helps Gemini Deep Research: it turns your question into a complete prompt, and answers any
  # clarifying question Gemini asks before it starts. Needs the ANTHROPIC_API_KEY secret; without it the
  # question is sent as written and Gemini's questions go unanswered.
  claude:
    model: claude-sonnet-5-5
    prepare_prompt: true          # false sends your question exactly as written
    max_rounds: 3                 # most questions from Gemini answered per report
    monthly_calls: 60             # most Claude calls per month
    max_tokens: 700
  # Auto seeds: instead of hand-writing what to search for each brand, the tool builds a factual profile of
  # the brand from its catalogue every run, and Claude turns it into Meta Ad Library keywords (direct rivals,
  # neighbouring categories and ad angles from ANY industry), benchmark BRANDS, hashtags and Deep Research
  # questions. They are saved and refreshed only when the catalogue changes or they get old. Seeds you write in a
  # brand's research.yaml always come first; add `auto_seeds: false` there to switch this off for that brand.
  # The brand's own name is always searched too (`track_own_brand: false` in its research.yaml switches that off).
  auto_seeds:
    enabled: true
    refresh_days: 30
    max_keywords: 8
    max_hashtags: 5               # per platform
    max_questions: 2
    max_benchmarks: 8             # benchmark brands Claude may suggest
    scopes: [direct, adjacent, cross_industry]
  # Benchmark brands (suggested by Claude, for example Gymshark or Oodie) are not searched by name, because that
  # returns every ad that merely mentions them. The tool looks up each brand's own Meta advertiser page once, then
  # follows that page. A match it is not sure of is never guessed: it is listed for you to choose in the run report
  # (brands/<brand>/research.yaml -> ads: benchmark_pages: { Name: PAGE_ID } or  Name: skip ).
  benchmarks:
    enabled: true
    max_pages: 6                  # benchmark pages followed per brand (pages you choose yourself are always followed)
    discovery_per_run: 3          # brand names looked up per run
    items_per_name: 10            # ads read while looking one brand up
    items_per_page: 8             # ads read from each followed page
    retry_days: 30                # a brand with no match is tried again after this many days
