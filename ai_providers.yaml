# AI providers: every platform in the pinned FreeLLMAPI v0.16.17 (84 ids), GitHub Models (called directly), and Claude: 86 in all.
# Switched on at present: cloudflare, cohere, google, groq, kilo, mistral, nvidia, ollama, openrouter, zhipu and claude. A test keeps this line equal to the enabled flags below. GitHub Models is retired (see its retired: record): kept, never enabled or called.
#
# NOTHING is on unless it says enabled: true. A provider carries the terms found when it was checked (terms.status says
# how well: verified = the provider's own page; verified_secondary = quoted by other sites; upstream_documented = the gateway
# project's notes only; declared_only/unverified = nothing checked), and a ceiling set by those terms (public until proven otherwise).
#
# To switch a provider on, a person: (1) creates the account and key (docs/ai/setup-instructions.md), (2) adds the key as a GitHub
# Secret, (3) reads its terms, (4) sets enabled: true and the classes it may receive in approved_classes. The loader refuses a
# provider that is unverified or declared_only being enabled.
#
# To let a provider receive INTERNAL data although its ceiling says public, add a recorded decision, for example:
#   owner_override: {ceiling: internal, approved_by: "Harish", date: "2026-11-03", reason: "paid tier, written no-training term read"}
# and add internal to approved_classes. Restricted data can be approved for claude only.
#
# models: is the version-controlled allowlist. A model is used only if listed here with approved: true. The remote gateway
# catalogue is switched off, and even if it were on it could not make a model routable.
#
# budgets: the conservative testing cap for paid use (only Claude is paid). A call is refused if its worst case would cross it.
# Keep the cap below the Anthropic balance; also set a spend limit in the Anthropic Console.
# 2026-11-03: Harish set the monthly cap to $10 (the same limit is set in the Anthropic Console) and kept the daily testing cap at $0.50.
# Nothing else here can spend money: the other providers are used only on free plans with no card on file, and a free quota that runs
# out stops that provider for the period. The tool never buys credits and never upgrades a plan.

version: 1
budgets:
  daily_usd: 0.5
  monthly_usd: 10.0
providers:
  github:
    label: GitHub Models
    enabled: false
    experimental: false
    ceiling: public
    approved_classes:
    - public
    - internal
    owner_override:
      ceiling: internal
      approved_by: Harish
      date: '2026-11-03'
      reason: 'Owner decision: Internal project and business data may be sent to every enabled provider, including free plans whose terms may allow training on prompts. The material is not secret and the aim is the best research results. Restricted data, credentials, keys, passwords and tokens are never sent.'
    gateway_platform: github
    retired:
      date: '2026-07-30'
      source: https://github.blog/changelog/2026-07-30-github-models-is-now-retired/
      reason: "GitHub fully retired GitHub Models on 30 July 2026 (announced 1 July) - the playground, model catalogue, inference API and BYOK are no longer available to any customer. Every endpoint answers a plain-text OK, which was seen live on 2026-11-11 with the job's own token, a fine-grained token and no token at all. The integration was removed; this record stays so nobody rebuilds it."
    terms:
      status: verified_secondary
      date: '2026-11-03'
      trains_on_data: not confirmed in the pages checked (secondary sources and GitHub's own blog); the models are served by their publishers through GitHub, so read GitHub's terms before relying on this
      retention: not confirmed
      business_use: GitHub describes the free tier as for prototyping. Paid inference is used only if someone turns it on in GitHub settings; it must stay off. The workflow's own token needs the permission models read
      note: 'free with any GitHub account and no card; per-request limits are 8,000 tokens in and 4,000 out; small models 15 requests a minute and 150 a day, large models 10 and 50 (checked 2026-11-03 against GitHub''s blog and secondary summaries)'
    limits:
      requests_per_day: 150
      requests_per_minute: 15
    models:
    - id: openai/gpt-4.1-mini
      approved: true
      capabilities: [text, tools]
      note: small-model tier (15 a minute, 150 a day)
    - id: meta/Llama-3.3-70B-Instruct
      approved: true
      capabilities: [text, tools]
      note: small-model tier per the summaries checked; if GitHub counts it as large (50 a day) the daily limit here would be too high, so confirm in the first live check
    - id: openai/gpt-4.1
      approved: false
      capabilities: [text, vision, tools]
      note: large-model tier (10 a minute, 50 a day); not approved until the provider limit can be set per model
    - id: openai/gpt-4o
      approved: false
      capabilities: [text, vision, tools]
      note: large-model tier; not approved for the same reason
    - id: deepseek/DeepSeek-V3-0324
      approved: false
      capabilities: [text]
      note: present for review; not approved
    - id: microsoft/Phi-4
      approved: false
      capabilities: [text]
      note: present for review; not approved
